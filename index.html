<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>try{var __t=localStorage.getItem("quiz-theme");if(__t==="light"||__t==="dark")document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷題目錄｜統計學・巨量資料概論・TOEIC</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="刷題目錄">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#6B6B6B; --faint:#A3A3A3; --line:#E7E7E7; --soft:#F6F6F6;
  --mid:#9A9A9A; --on-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0F; --ink:#F2F2F2; --muted:#A3A3A3; --faint:#666666; --line:#262626; --soft:#181818;
    --mid:#5C5C5C; --on-ink:#0F0F0F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --ink:#F2F2F2; --muted:#A3A3A3; --faint:#666666; --line:#262626; --soft:#181818;
  --mid:#5C5C5C; --on-ink:#0F0F0F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.7;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--ink);text-underline-offset:3px}
svg{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px calc(80px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){.wrap{padding:44px 32px 96px}}

/* 頂列 */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
@media (min-width:768px){.topbar-in{padding:12px 32px}}
.brand{appearance:none;border:0;background:none;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:.98rem;letter-spacing:.02em}
.syncbtn{appearance:none;border:0;background:none;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.syncbtn:hover{color:var(--ink)}
.tb-right{display:flex;align-items:center;gap:14px}
.themesw{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.themesw button{appearance:none;border:0;background:none;color:var(--muted);font-size:.74rem;padding:3px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
.themesw button:hover{color:var(--ink)}
.themesw button.on{background:var(--ink);color:var(--on-ink)}
@media (max-width:420px){.themesw button{padding:3px 7px;font-size:.7rem}.tb-right{gap:10px}.syncbtn{font-size:.74rem}}
/* Part 7 閱讀分欄 */
body.readmode{overflow:hidden}
body.readmode .topbar-in{max-width:1320px}
.wrap.readmode{max-width:1320px;padding:14px 24px 14px;height:calc(100vh - 62px);height:calc(100dvh - 62px - env(safe-area-inset-top,0px));display:flex;flex-direction:column}
.rhead{flex:none;margin-bottom:10px}
.rhead .back{margin-bottom:6px}
.rhead h1{font-size:1.2rem;margin:0 0 8px}
.setnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.setchip{appearance:none;flex:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:.78rem;cursor:pointer;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.setchip small{font-size:.72rem}
.setchip.done{color:var(--ink);border-color:var(--faint)}
.setchip.cur{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.reading{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.pane-l,.pane-r{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.pane-l{background:var(--soft)}
.pane-title{margin:0 0 12px;font-size:.75rem;letter-spacing:.06em;color:var(--muted)}
.doc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;font-size:.95rem;line-height:1.85}
.doc .p-body{white-space:pre-line}
.rq{padding:4px 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.rq:last-of-type{border-bottom:0}
.rq-text{font-size:1rem;margin:0 0 12px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pane-l .blank{cursor:pointer}
.dirs{margin:0 0 14px;font-size:.8rem;line-height:1.6;color:var(--muted);font-style:italic}
.pane-title{font-size:.9rem!important;letter-spacing:0!important;color:var(--ink)!important;font-weight:700;margin:0 0 10px!important}
.blank6{cursor:pointer;white-space:nowrap;letter-spacing:.06em;color:var(--ink)}
.blank6.flash,.blank.flash{background:var(--ink);color:var(--on-ink)}
.bn{font-size:.68em;font-weight:700;margin-right:2px;letter-spacing:0}
.optl{flex:none;min-width:2.2em;font-weight:600;color:var(--muted)}
.opt.sel .optl,.opt.right .optl{color:var(--ink)}
.opt.wrong .optl{color:var(--muted)}
.pane-l .blank.pick,.pane-l .blank.done{display:inline;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pane-l .blank.pick{min-width:0;color:var(--ink);font-size:.9em;border-bottom:2px solid var(--ink);text-align:left}
.pane-l .blank.done{min-width:0;font-size:.92em;border-bottom:2px solid var(--ink);color:var(--ink);text-align:left}
.pane-l .blank.done.miss{border-bottom-style:dashed}
.pane-l .blank.flash{background:var(--ink);color:var(--on-ink)}
.qlocate{font-weight:700;color:var(--ink);font-size:.9rem;text-decoration-color:var(--faint)}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.submitbar{position:sticky;bottom:-16px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:4px}
.pane-r .result{margin:0 0 4px}
.pane-r .nav{margin-top:14px}
.pane-r .tools{margin-top:16px}
@media (max-width:860px){
  .wrap.readmode{padding:10px 12px 10px}
  .rhead h1{font-size:1.05rem;margin-bottom:6px}
  .reading{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .pane-l,.pane-r{padding:12px 14px}
  .doc{padding:12px;font-size:.92rem}
}
.syncdot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint)}
.syncbtn[data-s="ok"] .syncdot,.syncbtn[data-s="idle"] .syncdot{background:var(--ink);border-color:var(--ink)}
.syncbtn[data-s="busy"] .syncdot,.syncbtn[data-s="pending"] .syncdot{background:var(--faint);border-color:var(--faint)}
.syncbtn[data-s="err"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px} .syncbtn[data-s="err"] .syncdot{background:var(--ink);border-color:var(--ink)}

/* 標題 */
h1{font-size:1.5rem;line-height:1.35;margin:0 0 6px;font-weight:700;letter-spacing:.01em}
h2{font-size:1rem;margin:36px 0 12px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.back{appearance:none;border:0;background:none;padding:0;margin:0 0 18px;cursor:pointer;color:var(--muted);font-size:.88rem;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--ink)}
.note{font-size:.85rem;color:var(--muted)}

/* 目錄樹 */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree{margin-top:28px;border-top:1px solid var(--line)}
.tree>li{border-bottom:1px solid var(--line)}
.tree ul{margin:0 0 10px 9px;padding-left:18px;border-left:1px solid var(--line)}
.folder>summary{list-style:none}
.folder>summary::-webkit-details-marker{display:none}
.row{appearance:none;border:0;background:none;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 6px;border-radius:6px}
.row:hover{background:var(--soft)}
.row .name{flex:1;min-width:0}
.row .meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .meta b{color:var(--ink);font-weight:600}
.row .meta .bad{color:var(--ink)}
.row .chev{width:16px;height:16px;color:var(--faint);transition:transform .2s ease}
.folder[open]>summary .chev{transform:rotate(90deg)}
.tree>li>.folder>summary{min-height:60px;font-size:1.08rem;font-weight:700}
.row.off{cursor:default;color:var(--faint)} .row.off:hover{background:none}
.row.done .name::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:8px;vertical-align:2px}

/* 答案卡 */
.sheet{margin:22px 0 16px;border:1px solid var(--line);border-radius:10px;padding:0 16px}
.sheet>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;font-size:.88rem}
.sheet>summary::-webkit-details-marker{display:none}
.sheet>summary .t{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sheet>summary .chev{width:14px;height:14px;color:var(--faint);transition:transform .2s ease}
.sheet[open]>summary .chev{transform:rotate(90deg)}
.sheet>summary .score{color:var(--muted);font-variant-numeric:tabular-nums}
.sheet[open]{padding-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.cell{position:relative;appearance:none;height:38px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.cell:not(.ok):not(.bad):hover{border-color:var(--ink);color:var(--ink)}
.cell.ok{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.cell.bad{background:var(--mid);border-color:var(--mid);color:#fff}
.cell.cur{outline:2px solid var(--ink);outline-offset:2px}
.cell.fl::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* 題目 */
.panel{border:1px solid var(--line);border-radius:10px;padding:20px;scroll-margin-top:72px}
@media (min-width:768px){.panel{padding:26px 28px}}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-weight:700;font-size:.9rem;color:var(--ink);display:flex;align-items:center;gap:10px}
.chip{font-weight:400;font-size:.78rem;color:var(--muted)}
.qactions{display:flex;gap:6px}
.copybtn,.flagbtn{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:3px 12px;font-size:.78rem;cursor:pointer}
.copybtn:hover,.flagbtn:hover{border-color:var(--ink);color:var(--ink)}
.copybtn.copied{border-color:var(--ink);color:var(--ink)}
.flagbtn.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.qtext{font-size:1.1rem;line-height:1.8;margin:0 0 20px;font-weight:600;white-space:pre-line}
.opts+.optfirst-q{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.src{font-size:.8rem;color:var(--muted);margin:-12px 0 16px}
.passage{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 18px;background:var(--soft);font-size:.95rem;line-height:1.85}
.p-kind{margin:0 0 8px;font-size:.75rem;letter-spacing:.06em;color:var(--muted)}
.p-head{margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);white-space:pre-line;font-size:.86rem;color:var(--muted)}
.p-body{white-space:pre-line}
.blank{display:inline-block;min-width:4.5em;padding:0 4px;border-bottom:1px solid var(--faint);color:var(--muted);font-size:.85em;text-align:center}
.blank.cur{border-bottom:2px solid var(--ink);color:var(--ink);font-weight:700;background:var(--bg)}
.blank.done{min-width:0;color:var(--ink);font-size:1em;border-bottom-style:dotted;text-align:left}
.ptrans{margin-top:12px} .ptrans summary{cursor:pointer;color:var(--muted);font-size:.85rem} .ptrans p{margin:6px 0 0;font-size:.9rem;line-height:1.75;color:var(--muted)}
@media (max-width:560px){.passage{padding:14px;font-size:.92rem}}
.opts{display:grid;gap:8px}
.opt{appearance:none;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px;cursor:pointer;min-height:48px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:600;color:var(--muted);margin-top:1px}
.opt.right{border-color:var(--ink)}
.opt.right .bub{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opt.wrong{border-color:var(--mid);background:var(--soft)}
.opt.wrong>span:last-child{text-decoration:line-through;text-decoration-color:var(--mid);color:var(--muted)}
.opt.wrong .bub{background:var(--mid);border-color:var(--mid);color:#fff}
.opt:disabled:not(.right):not(.wrong){color:var(--muted)}
.hint{margin-top:16px} .hint summary{cursor:pointer;color:var(--muted);font-size:.85rem} .hint p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.exp{margin-top:22px;padding:2px 0 2px 16px;border-left:2px solid var(--ink)}
.exp.isbad{border-left-color:var(--mid)}
.verdict{font-weight:700;margin:0 0 10px}

.qtrans{background:var(--soft);padding:10px 14px;margin:10px 0 12px;border-radius:6px;font-size:.93rem;line-height:1.65}
.qexp-text{margin:0 0 10px;line-height:1.75}
.qopt-breakdown{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.9rem;line-height:1.7;color:var(--muted)}
.qopt-breakdown strong,.qtrans strong{color:var(--ink)}

/* 按鈕 */
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 20px;font-size:.92rem;font-weight:500;cursor:pointer;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.primary:hover:not(:disabled){opacity:.85}
.btn:disabled{opacity:.3;cursor:default}
.tools{display:flex;gap:20px;flex-wrap:wrap;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.linkbtn,.tools button{appearance:none;border:0;background:none;padding:4px 0;cursor:pointer;font-size:.84rem;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.linkbtn:hover,.tools button:hover{color:var(--ink);text-decoration-color:var(--ink)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.result{border:1px solid var(--ink);border-radius:10px;padding:16px 18px;margin:20px 0 0}
.result p{margin:0 0 12px}

/* 表單 */
fieldset{border:0;padding:0;margin:0 0 20px}
legend{font-weight:700;margin-bottom:6px;font-size:.92rem}
.radio{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.radio:last-child{border-bottom:0}
.radio input{accent-color:var(--ink);width:18px;height:18px}
.count{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count input,.field input,textarea.bk{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}
.count input{width:90px}
.quick{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 14px;font-size:.84rem;cursor:pointer}
.quick:hover{border-color:var(--ink)}
.field{display:grid;gap:6px;margin:0 0 14px}
.field span{font-weight:600;font-size:.9rem}
.field input,textarea.bk{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace}
textarea.bk{min-height:90px;resize:vertical;margin-top:12px}
.steps{margin:0 0 18px;padding-left:1.3em;font-size:.93rem} .steps li{margin:6px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--soft);border-radius:4px;padding:1px 5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 16px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}
.errbox{border-left:2px solid var(--ink);color:var(--ink);padding:4px 0 4px 12px;margin:0 0 16px;font-size:.9rem}

/* 報告 */
.tagrow{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.tagrow:last-child{border-bottom:0}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}

.pct{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem;white-space:nowrap}
.weak{border-left:2px solid var(--ink);padding:0 0 0 14px;margin:0 0 26px}
.weak h3{margin:0 0 4px;font-size:1rem}
.weak .stat{font-size:.82rem;color:var(--muted);margin:0 0 8px}
.weak p{margin:0 0 8px;font-size:.93rem}
.wlist{margin:6px 0 0;padding:0;list-style:none;font-size:.9rem}
.wlist li{margin:6px 0}
.link{appearance:none;border:0;background:none;padding:0;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.link:hover{text-decoration-color:var(--ink)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--on-ink);padding:9px 18px;border-radius:8px;font-size:.86rem;opacity:0;transition:all .2s ease;pointer-events:none;z-index:99;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (hover:none){
  .row:hover{background:none}
  .opt:hover:not(:disabled){border-color:var(--line)}
  .btn:not(.primary):hover:not(:disabled){border-color:var(--line)}
  .cell:not(.ok):not(.bad):hover{border-color:var(--line);color:var(--muted)}
}
@media (max-width:560px){
  h1{font-size:1.3rem}
  .panel{padding:16px 14px}
  .qtext{font-size:1.04rem}
  .nav .btn{flex:1}
  .tagrow{grid-template-columns:1fr auto;row-gap:6px}
  .tagrow .bar{grid-column:1/-1;grid-row:2}
  .tree ul{margin-left:8px;padding-left:12px}
  .row{gap:10px;padding:8px 4px}
}
/* 計時與統計 */
.qtimer{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qtimer b{color:var(--ink);font-weight:600}
.vtime{font-weight:400;color:var(--muted);font-size:.85rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 8px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi span{display:block;font-size:.78rem;color:var(--muted)}
.kpi b{display:block;font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}

<body>

<main class="wrap" id="app"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* ===== 題庫資料放在 data/ 資料夾（由 data/manifest.json 列出），開啟網頁時載入 ===== */
const TAGS={}, TOEIC_EXAMS=[], PAST=[], EXAMS=[], STAT_PAST=[], AI_JR=[], AI_SR=[];
const DATA_DIR="data/";
let DATA_READY=false;

const L="ABCD", KEY="bigdata-quiz-v2";

const ALL = [];
const QM = {};
function addData(d){
  if(!d||typeof d!=="object")return;
  if(d.tags)Object.assign(TAGS,d.tags);
  (d.exams||[]).forEach(ex=>{
    const arr=ex.scope==="stat"?STAT_PAST:ex.scope==="ai_jr"?AI_JR:ex.scope==="ai_sr"?AI_SR:ex.kind==="past"?PAST:ex.kind==="mock"?EXAMS:TOEIC_EXAMS;
    const i=arr.findIndex(e=>e.id===ex.id);if(i>=0)arr[i]=ex;else arr.push(ex);
  });
}
function buildIndex(){
  ALL.length=0;ALL.push(...TOEIC_EXAMS,...STAT_PAST,...AI_JR,...AI_SR,...PAST,...EXAMS);
  Object.keys(QM).forEach(k=>delete QM[k]);
  ALL.forEach(ex=>ex.qs.forEach((q,i)=>{QM[ex.id+"-"+i]={ex,i,q}}));
}
/* ---------- AI應用規劃師題庫加密：輸入密碼後才在瀏覽器解密（PBKDF2-SHA256＋AES-256-GCM，加密見 tools/encrypt_ai.py） ---------- */
const AILock={locked:[],msg:"",busy:false,KEY:"quiz-ai-key",
  b64:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),
  async derive(pw,env){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:this.b64(env.salt),iterations:env.iter},base,{name:"AES-GCM",length:256},true,["decrypt"])},
  async open(env,key){const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:this.b64(env.iv)},key,this.b64(env.data));
    const s=new Blob([raw]).stream();
    return JSON.parse(await new Response(env.gz?s.pipeThrough(new DecompressionStream("gzip")):s).text())},
  // 全部解開才載入；密碼錯誤時 decrypt 會丟出例外，題庫維持鎖定
  async unlock(key){const ds=[];for(const env of this.locked)ds.push(await this.open(env,key));
    ds.forEach(addData);this.locked=[];buildIndex()},
  async tryPassword(pw,remember){const env=this.locked[0],key=await this.derive(pw,env);await this.unlock(key);
    if(remember)try{const k=new Uint8Array(await crypto.subtle.exportKey("raw",key));
      localStorage.setItem(this.KEY,JSON.stringify({salt:env.salt,k:btoa(String.fromCharCode(...k))}))}catch(e){}},
  async trySaved(){if(!this.locked.length||!window.crypto||!crypto.subtle)return;
    let s=null;try{s=JSON.parse(localStorage.getItem(this.KEY)||"null")}catch(e){}
    if(!s||s.salt!==this.locked[0].salt)return;
    try{await this.unlock(await crypto.subtle.importKey("raw",this.b64(s.k),"AES-GCM",false,["decrypt"]))}catch(e){this.forget()}},
  saved(){try{return !!localStorage.getItem(this.KEY)}catch(e){return false}},
  forget(){try{localStorage.removeItem(this.KEY)}catch(e){}}
};
async function loadData(){
  const get=async(p,v)=>{const r=await fetch(DATA_DIR+p+(v?"?v="+v:""),{cache:"no-cache"});if(!r.ok)throw new Error(p+"（HTTP "+r.status+"）");return r.json()};
  const m=await get("manifest.json");
  const list=await Promise.all(m.files.map(f=>get(f.path,f.v)));
  list.forEach(d=>{if(d&&d.enc)AILock.locked.push(d);else addData(d)});
  buildIndex();
  await AILock.trySaved();
}
const qNo=id=>{const {i,q}=QM[id];return q.n||i+1};
const qLabel=id=>QM[id].ex.title+" 第 "+qNo(id)+" 題";
const findEx=id=>ALL.find(e=>e.id===id)||ALL[0];
const VIEWS=["home","exam","pset","prac","report","sync","stats"];

let st={view:"home", scope:"bigdata", exam:"toeic_p5_full", open:{}, sheetOpen:null, cur:{}, ans:{}, flags:{}, pr:null, ansT:{}, flagT:{}, curT:{}, tlog:[]};

const EXAM_MIGRATE={"p5_pos_1": ["p5_pos", 0], "p5_pos_2": ["p5_pos", 20], "p5_pos_3": ["p5_pos", 40], "p5_pos_4": ["p5_pos", 60], "p5_conj_1": ["p5_conj", 0], "p5_conj_2": ["p5_conj", 15], "p5_conj_3": ["p5_conj", 30], "p5_conj_4": ["p5_conj", 45], "p5_pron_2": ["p5_pron", 25], "p5_fin_2": ["p5_fin", 25], "p5_voice_2": ["p5_voice", 25], "p5_tense_2": ["p5_tense", 25], "p5_chunk_1": ["p5_chunk", 0], "p5_chunk_2": ["p5_chunk", 20], "p5_chunk_3": ["p5_chunk", 40], "p5_chunk_4": ["p5_chunk", 60], "p5_vocab_1": ["p5_vocab", 0], "p5_vocab_2": ["p5_vocab", 15], "p5_vocab_3": ["p5_vocab", 30], "p5_vocab_4": ["p5_vocab", 45]};
// 舊題組（例如 詞性題 1～4）合併後，把「舊題組-題號」轉成「新題組-題號」，保留作答、標註與進度
const QUESTION_MIGRATE={"p7_1-12": "p7_t1-0", "p7_1-13": "p7_t1-1", "p7_1-9": "p7_t1-2", "p7_1-10": "p7_t1-3", "p7_2-3": "p7_t1-4", "p7_2-4": "p7_t1-5", "p7_2-10": "p7_t1-6", "p7_2-11": "p7_t1-7", "p7_1-0": "p7_t1-8", "p7_1-1": "p7_t1-9", "p7_1-2": "p7_t1-10", "p7_1-6": "p7_t1-11", "p7_1-7": "p7_t1-12", "p7_1-8": "p7_t1-13", "p7_2-6": "p7_t1-14", "p7_2-7": "p7_t1-15", "p7_2-8": "p7_t1-16", "p7_1-3": "p7_t1-18", "p7_1-4": "p7_t1-19", "p7_1-5": "p7_t1-20", "p7_2-0": "p7_t1-21", "p7_2-1": "p7_t1-22", "p7_2-2": "p7_t1-24", "p7_2-12": "p7_t1-25", "p7_2-13": "p7_t1-27", "p7_2-14": "p7_t1-28", "p7_3-0": "p7_t1-29", "p7_3-1": "p7_t1-30", "p7_3-2": "p7_t1-31", "p7_3-3": "p7_t1-32", "p7_3-4": "p7_t1-33", "p7_3-5": "p7_t1-34", "p7_3-6": "p7_t1-35", "p7_3-7": "p7_t1-36", "p7_3-8": "p7_t1-37", "p7_3-9": "p7_t1-38", "p7_4-0": "p7_t1-39", "p7_4-1": "p7_t1-40", "p7_4-2": "p7_t1-41", "p7_4-3": "p7_t1-42", "p7_4-4": "p7_t1-43", "p7_4-5": "p7_t1-44", "p7_4-6": "p7_t1-45", "p7_4-7": "p7_t1-46", "p7_4-8": "p7_t1-47", "p7_4-9": "p7_t1-48", "p7_4-10": "p7_t1-49", "p7_4-11": "p7_t1-50", "p7_4-12": "p7_t1-51", "p7_4-13": "p7_t1-52", "p7_4-14": "p7_t1-53", "p7_3-10": "p7_x2-0", "p7_3-11": "p7_x2-1", "p7_3-12": "p7_x2-2", "p7_3-13": "p7_x2-3", "p7_3-14": "p7_x2-4", "p7_3-15": "p7_x2-5", "p7_3-16": "p7_x2-6", "p7_3-17": "p7_x2-7", "p7_3-18": "p7_x2-8", "p7_3-19": "p7_x2-9", "p7_1-11": null, "p7_1-14": null, "p7_2-5": null, "p7_2-9": null};  // Part 7 重組為 Test 1（null＝刪除的題目）
const P7_OLD_EXAMS={"p7_1":"p7_t1","p7_2":"p7_t1","p7_3":"p7_t1","p7_4":"p7_t1"};
function migKey(k){if(Object.prototype.hasOwnProperty.call(QUESTION_MIGRATE,k))return QUESTION_MIGRATE[k];const m=/^(.+)-(\d+)$/.exec(k);if(!m)return k;const t=EXAM_MIGRATE[m[1]];return t?t[0]+"-"+(t[1]+(+m[2])):k}
function migPair(v,t){let ch=false;
  Object.keys(Object.assign({},v,t)).forEach(k=>{const nk=migKey(k);if(nk===k)return;ch=true;
    const ts=t[k]||0;
    if(nk!==null&&(!(nk in t)||ts>t[nk])){if(v[k]===undefined)delete v[nk];else v[nk]=v[k];t[nk]=ts||1}
    delete v[k];delete t[k]});
  return ch}
function migCur(c,t){let ch=false;
  Object.keys(Object.assign({},c,t)).forEach(k=>{if(P7_OLD_EXAMS[k]){delete c[k];delete t[k];ch=true;return}const m=EXAM_MIGRATE[k];if(!m)return;ch=true;
    const ts=t[k]||0;
    if(c[k]!==undefined&&(!(m[0] in t)||ts>t[m[0]])){c[m[0]]=m[1]+c[k];t[m[0]]=ts||1}
    delete c[k];delete t[k]});
  return ch}
function migrateData(o){
  if(!o||typeof o!=="object")return false;
  ["ans","ansT","flags","flagT","cur","curT"].forEach(k=>{if(!o[k]||typeof o[k]!=="object")o[k]={}});
  let ch=migPair(o.ans,o.ansT);ch=migPair(o.flags,o.flagT)||ch;ch=migCur(o.cur,o.curT)||ch;
  return ch;
}
const OPTION_REMAP={"p7_1-0": [1, 3, 0, 2], "p7_1-1": [0, 3, 2, 1], "p7_1-2": [1, 0, 3, 2], "p7_1-3": [3, 2, 0, 1], "p7_1-4": [3, 1, 2, 0], "p7_1-6": [0, 2, 3, 1], "p7_1-7": [3, 0, 2, 1], "p7_1-8": [1, 2, 3, 0], "p7_1-9": [3, 1, 0, 2], "p7_1-10": [3, 0, 2, 1], "p7_1-11": [3, 2, 1, 0], "p7_1-12": [1, 0, 2, 3], "p7_1-13": [2, 1, 3, 0], "p7_2-0": [3, 0, 2, 1], "p7_2-1": [1, 3, 0, 2], "p7_2-3": [1, 0, 2, 3], "p7_2-4": [0, 3, 2, 1], "p7_2-5": [2, 0, 1, 3], "p7_2-6": [1, 0, 3, 2], "p7_2-7": [3, 1, 2, 0], "p7_2-9": [1, 2, 3, 0], "p7_2-10": [1, 2, 0, 3], "p7_2-11": [3, 2, 1, 0], "p7_2-12": [2, 1, 0, 3], "p7_2-13": [1, 2, 0, 3], "p7_2-14": [3, 1, 0, 2], "p7_3-0": [2, 3, 0, 1], "p7_3-1": [3, 2, 1, 0], "p7_3-2": [2, 3, 1, 0], "p7_3-3": [3, 1, 2, 0], "p7_3-5": [3, 0, 2, 1], "p7_3-6": [0, 3, 1, 2], "p7_3-7": [1, 3, 0, 2], "p7_3-8": [2, 0, 3, 1], "p7_3-9": [2, 0, 3, 1], "p7_3-10": [3, 2, 0, 1], "p7_3-12": [2, 0, 1, 3], "p7_3-13": [2, 1, 3, 0], "p7_3-14": [2, 1, 0, 3], "p7_3-15": [2, 0, 3, 1], "p7_3-16": [0, 2, 1, 3], "p7_3-17": [2, 0, 1, 3], "p7_3-19": [2, 1, 3, 0]};  // p7_1-14 題目已改寫，舊作答直接清除
// Part 7 選項重新排列後，把已存的作答（選項索引）換到新位置；optv 標記避免重複轉換
function remapOpts(o){
  if(!o||typeof o!=="object"||o.optv===1)return false;
  let ch=false;const A=o.ans||{};
  Object.keys(OPTION_REMAP).forEach(k=>{if(A[k]!==undefined&&OPTION_REMAP[k][A[k]]!==undefined){A[k]=OPTION_REMAP[k][A[k]];ch=true}});
  ["p7_1-14"].forEach(k=>{if(A[k]!==undefined){delete A[k];if(o.ansT)o.ansT[k]=Date.now();ch=true}});
  o.optv=1;return ch;
}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.ans){st=Object.assign(st,s)}}catch(e){}
  if(!st.migratedV1){
    try{const o=JSON.parse(localStorage.getItem("bigdata-quiz-v1")||"null");
      if(o&&o.ans){Object.keys(o.ans).forEach(k=>{if(st.ans["e1-"+k]===undefined)st.ans["e1-"+k]=o.ans[k]});if(st.cur.e1===undefined)st.cur.e1=o.cur||0}}catch(e){}
    st.migratedV1=true;
  }
  ["ansT","flagT","curT","open"].forEach(k=>{if(!st[k]||typeof st[k]!=="object")st[k]={}});
  if(!Array.isArray(st.tlog))st.tlog=[];pruneTlog();
  Object.keys(st.ans).forEach(k=>{if(!st.ansT[k])st.ansT[k]=1});
  Object.keys(st.flags).forEach(k=>{if(!st.flagT[k])st.flagT[k]=1});
  Object.keys(st.cur).forEach(k=>{if(!st.curT[k])st.curT[k]=1});
  if(st.optv!==1&&st.pr&&st.pr.ans){Object.keys(st.pr.ans).forEach(k=>{const r=OPTION_REMAP[k];if(r&&r[st.pr.ans[k]]!==undefined)st.pr.ans[k]=r[st.pr.ans[k]]})}
  remapOpts(st);
  migrateData(st);
  if(EXAM_MIGRATE[st.exam])st.exam=EXAM_MIGRATE[st.exam][0];
  if(P7_OLD_EXAMS[st.exam])st.exam=P7_OLD_EXAMS[st.exam];
  if(st.pr&&Array.isArray(st.pr.ids)){st.pr.ids=st.pr.ids.map(migKey).filter(k=>k!==null);const pa={};Object.keys(st.pr.ans||{}).forEach(k=>{const nk=migKey(k);if(nk!==null)pa[nk]=st.pr.ans[k]});st.pr.ans=pa;if(st.pr.i>=st.pr.ids.length)st.pr.i=0}
  if(st.p7d&&typeof st.p7d==="object"){const d={};Object.keys(st.p7d).forEach(k=>{const nk=migKey(k);if(nk!==null)d[nk]=st.p7d[k]});st.p7d=d}
  if(!VIEWS.includes(st.view)||st.view==="sync")st.view="home";
}

/* ---------- 本機儲存 ---------- */
let dirty=false, prevCur={};
const now=()=>Date.now();
function setAns(id,k){st.ans[id]=k;st.ansT[id]=now();dirty=true}
function delAns(id){if(st.ans[id]!==undefined){delete st.ans[id];st.ansT[id]=now();dirty=true}}
function toggleFlag(id){if(st.flags[id])delete st.flags[id];else st.flags[id]=true;st.flagT[id]=now();dirty=true}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function save(){
  Object.keys(st.cur).forEach(k=>{if(prevCur[k]!==st.cur[k]){st.curT[k]=now();dirty=true}});
  prevCur={...st.cur};
  persist();
  if(dirty){dirty=false;Sync.schedule()}
}

/* ---------- 作答計時：顯示中的題目（或題組）才計時；離開頁面、切到別題就重新計時 ---------- */
const QT={key:null,start:0,away:false};
const TLOG_DAYS=180;
function curSet(ex){const sets=p7Sets(ex),cur=st.cur[ex.id]||0;return sets.find(s=>s.idx.includes(cur))||sets[0]}
function timingKey(){
  if(!DATA_READY||QT.away||document.visibilityState!=="visible")return null;
  if(st.view==="exam"){const ex=findEx(st.exam);if(!ex)return null;
    if(ex.part===6||ex.part===7){const set=curSet(ex);if(!set||p7Status(ex,set).done)return null;return "set|"+ex.id+"|"+set.p}
    const id=ex.id+"-"+(st.cur[ex.id]||0);return st.ans[id]===undefined?"q|"+id:null}
  if(st.view==="prac"&&st.pr&&st.pr.ids&&st.pr.ids.length){const id=st.pr.ids[st.pr.i];return st.pr.ans[id]===undefined?"p|"+id+"|"+st.pr.i:null}
  return null}
function syncTimer(){const k=timingKey();if(k!==QT.key){QT.key=k;QT.start=k?now():0}tickTimer()}
function elapsedFor(k){return QT.key===k&&QT.start?now()-QT.start:null}
function tickTimer(){const el=document.getElementById("qtimer");if(el)el.textContent=QT.key?fmtDur(now()-QT.start):"0:00"}
setInterval(tickTimer,1000);
document.addEventListener("visibilitychange",syncTimer);
window.addEventListener("blur",()=>{QT.away=true;syncTimer()});
window.addEventListener("focus",()=>{QT.away=false;syncTimer()});
function pruneTlog(){if(!Array.isArray(st.tlog)||!st.tlog.length)return;const lim=now()-TLOG_DAYS*864e5;if(st.tlog[0].t<lim)st.tlog=st.tlog.filter(r=>r.t>=lim)}
function logTime(id,ms,ok,extra){
  if(!Array.isArray(st.tlog))st.tlog=[];
  const r={t:now(),id,ok:ok?1:0};if(ms!=null&&ms>=0)r.ms=Math.round(ms);if(extra)Object.assign(r,extra);
  st.tlog.push(r);dirty=true;
}
function lastTime(id){const L=st.tlog||[];for(let i=L.length-1;i>=0;i--)if(L[i].id===id)return L[i];return null}
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function aggTime(list){let n=0,o=0,tn=0,ms=0;list.forEach(r=>{n++;if(r.ok)o++;if(r.ms!=null){tn++;ms+=r.ms}});return{n,o,tn,ms,acc:n?o/n:0,avg:tn?ms/tn:0}}
function todayAgg(){const k=dayKey(now());return aggTime((st.tlog||[]).filter(r=>dayKey(r.t)===k))}
function tlogCat(r){const it=QM[r.id];if(!it)return "其他";const ex=it.ex,sc=exScope(ex);
  if(sc==="toeic")return "TOEIC Part "+(ex.part||5);
  return {stat:"統計學",bigdata:"巨量資料概論",ai_jr:"AI應用規劃師（初級）",ai_sr:"AI應用規劃師（中級）"}[sc]||"其他"}
function timerChip(){const T=todayAgg();return `<span class="qtimer">計時 <b id="qtimer">0:00</b>${T.tn?`．今日平均 ${fmtDur(T.avg)}／題`:""}</span>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 官方公告多重正解（acc）或一律給分時，acc 內的選項都算答對
const okAns=(q,k)=>k===q.a||(Array.isArray(q.acc)&&q.acc.includes(k));
const keyTxt=q=>Array.isArray(q.acc)&&q.acc.length>1?(q.acc.length===4?"一律給分":q.acc.map(k=>"("+L[k]+")").join(" 或 ")):"("+L[q.a]+")";

/* ---------- 跨裝置同步（GitHub Gist） ---------- */
const SYNC_KEY="quiz-sync-v1", GIST_FILE="quiz-progress.json", GIST_DESC="刷題學習系統｜作答紀錄同步（請勿刪除）";
function payload(){return {app:"quiz-sync",v:1,optv:1,updatedAt:now(),ans:st.ans,ansT:st.ansT,flags:st.flags,flagT:st.flagT,cur:st.cur,curT:st.curT,tlog:st.tlog||[]}}
function stable(o){if(o===null||typeof o!=="object")return JSON.stringify(o);if(Array.isArray(o))return "["+o.map(stable).join(",")+"]";
  return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}"}
const dataKey=o=>stable({ans:o.ans||{},ansT:o.ansT||{},flags:o.flags||{},flagT:o.flagT||{},cur:o.cur||{},curT:o.curT||{},tl:Array.isArray(o.tlog)?o.tlog.length:0,tt:Array.isArray(o.tlog)&&o.tlog.length?o.tlog[o.tlog.length-1].t:0});
function mergeTlog(r){if(!Array.isArray(r)||!r.length)return false;if(!Array.isArray(st.tlog))st.tlog=[];
  const seen=new Set(st.tlog.map(x=>x.t+"|"+x.id));let ch=false;
  r.forEach(x=>{if(x&&x.t&&x.id&&!seen.has(x.t+"|"+x.id)){st.tlog.push(x);seen.add(x.t+"|"+x.id);ch=true}});
  if(ch){st.tlog.sort((a,b)=>a.t-b.t);pruneTlog()}return ch}
function mergeMap(lv,lt,rv,rt){
  let ch=false;rv=rv||{};rt=rt||{};
  new Set([...Object.keys(lt),...Object.keys(rt),...Object.keys(lv),...Object.keys(rv)]).forEach(k=>{
    const a=lt[k]||0,b=rt[k]||0;
    if(b>a||(b===a&&lv[k]===undefined&&rv[k]!==undefined)){
      if(rv[k]===undefined){if(lv[k]!==undefined){delete lv[k];ch=true}}
      else if(lv[k]!==rv[k]){lv[k]=rv[k];ch=true}
      if(b)lt[k]=b;
    }
  });
  return ch;
}
function mergeRemote(r){
  if(!r||typeof r!=="object")return false;
  if(remapOpts(r))r._migrated=true;
  if(migrateData(r))r._migrated=true;
  let ch=mergeMap(st.ans,st.ansT,r.ans,r.ansT);
  ch=mergeMap(st.flags,st.flagT,r.flags,r.flagT)||ch;
  ch=mergeMap(st.cur,st.curT,r.cur,r.curT)||ch;
  ch=mergeTlog(r.tlog)||ch;
  prevCur={...st.cur};
  return ch;
}

const Sync={
  cfg:{token:"",gistId:"",last:0}, state:"off", msg:"", busy:false, again:false, timer:null,
  loadCfg(){try{Object.assign(this.cfg,JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"))}catch(e){}this.state=this.cfg.token?"idle":"off"},
  saveCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(this.cfg))}catch(e){}},
  on(){return DATA_READY&&!!this.cfg.token},
  async api(path,opt={}){
    let r;
    try{
      r=await fetch("https://api.github.com"+path,{...opt,cache:"no-store",headers:{
        "Accept":"application/vnd.github+json","Authorization":"Bearer "+this.cfg.token,
        ...(opt.body?{"Content-Type":"application/json"}:{})}});
    }catch(e){throw new Error("無法連線到 GitHub，請確認網路")}
    if(r.status===401){const e=new Error("Token 無效或已過期，請重新設定");e.code=401;throw e}
    if(r.status===404){const e=new Error("找不到同步用的 Gist");e.code=404;throw e}
    if(r.status===403||r.status===429)throw new Error("GitHub 拒絕請求：Token 需要 gist 權限，或暫時超過使用額度");
    if(!r.ok)throw new Error("GitHub 回應錯誤（"+r.status+"）");
    return r.status===204?null:r.json();
  },
  async findOrCreate(){
    for(let page=1;page<=10;page++){
      const list=await this.api(`/gists?per_page=100&page=${page}`);
      const g=(list||[]).find(g=>g.files&&g.files[GIST_FILE]);
      if(g)return g.id;
      if(!list||list.length<100)break;
    }
    const g=await this.api("/gists",{method:"POST",body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
    return g.id;
  },
  async pull(){
    const g=await this.api("/gists/"+this.cfg.gistId);
    const f=g&&g.files&&g.files[GIST_FILE];
    if(!f)return null;
    let txt=f.content;
    if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text()}
    try{return JSON.parse(txt)}catch(e){return null}
  },
  async push(){
    await this.api("/gists/"+this.cfg.gistId,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
  },
  schedule(delay=2500){
    if(!this.on())return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{this.timer=null;this.run()},delay);
    if(!this.busy)this.setState("pending");
  },
  flush(){if(this.timer){clearTimeout(this.timer);this.timer=null;this.run()}},
  async run(){
    if(!this.on())return;
    if(this.busy){this.again=true;return}
    this.busy=true;this.setState("busy");
    let changed=false;
    try{
      if(!this.cfg.gistId){this.cfg.gistId=await this.findOrCreate();this.saveCfg()}
      let remote;
      try{remote=await this.pull()}
      catch(e){if(e.code!==404)throw e;this.cfg.gistId=await this.findOrCreate();this.saveCfg();remote=await this.pull()}
      changed=mergeRemote(remote);
      if(!remote||remote._migrated||dataKey(remote)!==dataKey(st))await this.push();
      this.cfg.last=now();this.saveCfg();persist();
      this.msg="";this.state="ok";
    }catch(e){
      this.msg=e.message||String(e);this.state="err";
      if(e.code===401){this.cfg={token:"",gistId:"",last:0};this.saveCfg()}
    }
    this.busy=false;
    if(changed||st.view==="sync")render();else renderTopbar();
    if(this.again){this.again=false;this.run()}
  },
  setState(s){this.state=s;renderTopbar()}
};


function fmtTime(t){
  if(!t)return "";const d=new Date(t),n=new Date(),p=x=>String(x).padStart(2,"0");
  const hm=p(d.getHours())+":"+p(d.getMinutes());
  return d.toDateString()===n.toDateString()?hm:(d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}
function syncLabel(){
  const s=Sync.on()?Sync.state:(Sync.state==="err"?"err":"off");
  return [s,{off:"未同步",idle:"同步已啟用",pending:"等待同步",busy:"同步中",ok:"已同步 "+fmtTime(Sync.cfg.last),err:"同步失敗"}[s]];
}

function showToast(msg){
  let t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t)}
  t.textContent=msg;t.classList.add("show");
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),2000);

function fallbackCopy(text,cb){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand("copy");if(cb)cb()}catch(e){alert("複製失敗，請手動複製")}
  document.body.removeChild(ta);
}
function copyText(text,cb){
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(cb).catch(()=>fallbackCopy(text,cb));
  else fallbackCopy(text,cb);
}
function passageHtml(ex,q,ansMap){
  const P=(ex.passages||[])[q.p];if(!P)return "";
  if(Array.isArray(P.docs)&&P.docs.length){
    return P.docs.map(d=>`<div class="passage"><p class="p-kind">${esc(d.kind||"")}</p>${d.head?`<p class="p-head">${esc(d.head)}</p>`:""}<div class="p-body">${esc(d.text||"")}</div></div>`).join("");
  }
  const body=esc(P.text).replace(/\{\{(\d+)\}\}/g,(m0,n)=>{n=+n;
    const qi=ex.qs.findIndex(x=>x.n===n),qq=ex.qs[qi],a=ansMap[ex.id+"-"+qi];
    if(n===q.n)return `<span class="blank cur">(${n})</span>`;
    if(qq&&a!==undefined)return `<span class="blank done">${esc(qq.o[qq.a])}</span>`;
    return `<span class="blank">(${n})</span>`});
  return `<div class="passage"><p class="p-kind">${esc(P.kind||"")}</p>${P.head?`<p class="p-head">${esc(P.head)}</p>`:""}<div class="p-body">${body}</div></div>`;
}
function passagePlain(ex,q){const P=(ex.passages||[])[q.p];if(!P)return "";
  return (P.head?P.head+"\n\n":"")+P.text.replace(/\{\{(\d+)\}\}/g,(m0,n)=>`(${n}) ______`)+"\n\n"}
function copyQuestion(id){
  const item=QM[id];if(!item)return;
  const {ex,q}=item,tag=TAGS[q.g]?TAGS[q.g].n:"";
  let text=`【${ex.title} 第 ${qNo(id)} 題】${tag?`[${tag}]`:""}\n${passagePlain(ex,q)}${q.q}\n\n`;
  q.o.forEach((opt,idx)=>{text+=`(${L[idx]}) ${opt}\n`});
  text+=`\n【正解】${keyTxt(q)}\n`;
  if(q.trans)text+=`【中文翻譯】${q.trans}\n`;
  if(q.e)text+=`【考點詳解】${q.e}\n`;
  if(q.w)text+=`【其他選項解析】${q.w}\n`;
  copyText(text,()=>{
    showToast("已複製題目與解析");
    const btn=document.querySelector(`.copybtn[data-id="${id}"]`);
    if(btn){btn.textContent="已複製";btn.classList.add("copied");setTimeout(()=>{btn.textContent="複製";btn.classList.remove("copied")},1800)}

}

function card(id,num,ansMap,showSrc){
  const {ex,q}=QM[id],a=ansMap[id],done=a!==undefined,fl=!!st.flags[id];
  let h=`<div class="panel"><div class="qtop">
  <span class="qno">第 ${num} 題<span class="chip">${TAGS[q.g]?TAGS[q.g].n:""}</span></span>${done?"":timerChip()}
  <div class="qactions">
    <button class="copybtn" data-act="copy" data-id="${id}" title="複製此題、選項與解析">複製</button>
    <button class="flagbtn ${fl?"on":""}" data-act="flag" data-id="${id}" aria-pressed="${fl}">${fl?"已標註":"標註"}</button>
  </div></div>
`;
  const isP=q.p!==undefined;
  let qt=(isP?passageHtml(ex,q,ansMap):"")+`<p class="qtext">${esc(q.q)}</p>`;
  if(showSrc)qt+=`<p class="src">出自${qLabel(id)}</p>`;
  let op=`<div class="opts">`;
  q.o.forEach((t,k)=>{let c="opt";if(done){if(okAns(q,k))c+=" right";else if(k===a)c+=" wrong"}
    op+=`<button class="${c}" data-act="pick" data-id="${id}" data-k="${k}" ${done?"disabled":""}><span class="bub">${L[k]}</span><span>${esc(t)}</span></button>`});
  op+=`</div>`;
  h+=st.optFirst&&!done&&!isP?`${op}<div class="optfirst-q">${qt}</div>`:qt+op;
  if(!done&&q.h)h+=`<details class="hint"><summary>提示</summary><p>${esc(q.h)}</p></details>`;
  else if(done){
    const g=okAns(q,a),lt=lastTime(id);
    h+=`<div class="exp ${g?"":"isbad"}">
    <p class="verdict">${g?"答對":"答錯．你選 ("+L[a]+")"}，正解 ${keyTxt(q)}${lt&&lt.ms!=null?`<span class="vtime">．用時 ${fmtDur(lt.ms)}</span>`:""}</p>
    ${q.trans?`<div class="qtrans"><strong>中文翻譯　</strong>${esc(q.trans)}</div>`:""}
    ${q.e?`<p class="qexp-text"><strong>${ex.unofficial?"參考解析":"詳解"}　</strong>${esc(q.e)}</p>`:`<p class="note">此題目前僅收錄${ex.kind==="past"?"官方公布答案":"答案"}。</p>`}
    ${q.w?`<div class="qopt-breakdown"><strong>其他選項　</strong>${esc(q.w)}</div>`:""}
    ${ex.unofficial?`<p class="note">本年度為參考解答，非官方公布答案。</p>`:""}
    ${isP&&ex.passages[q.p].trans?`<details class="ptrans"><summary>全文翻譯</summary><p>${esc(ex.passages[q.p].trans)}</p></details>`:""}
    </div>`;
  }
  return h+`</div>`;
}

function vTrend(L){
  const cats=CAT_ORDER.filter(c=>L.some(r=>tlogCat(r)===c));
  if(!cats.length)return "";
  let cat=st.chartCat;if(!cats.includes(cat)){const lastR=L[L.length-1];cat=tlogCat(lastR)}
  let rows=L.filter(r=>tlogCat(r)===cat);const first=!!st.chartFirst;
  if(first)rows=firstOnly(rows);
  const days={};rows.forEach(r=>{const k=dayKey(r.t);(days[k]=days[k]||[]).push(r)});
  const keys=Object.keys(days).sort(),agg=keys.map(k=>({k,a:aggTime(days[k])}));
  let h=`<h2>進步曲線</h2><p class="note">只畫有作答的日子；每一科分開計算</p>
  <div class="chips">${cats.map(c=>`<button class="${c===cat?"on":""}" data-act="chartCat" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="chips"><button class="${first?"":"on"}" data-act="chartFirst" data-v="0">含重做</button><button class="${first?"on":""}" data-act="chartFirst" data-v="1">只算第一次作答</button></div>`;
  if(!agg.length)return h+`<p style="margin-top:14px">這個範圍還沒有紀錄。</p>`;
  const lab=k=>k.slice(5).replace("-","/");
  const accPts=agg.map(({k,a})=>({lab:lab(k),y:a.acc*100,tip:`${lab(k)}．${a.n} 題．正確率 ${Math.round(a.acc*100)}%`}));
  const tPts=agg.map(({k,a})=>({lab:lab(k),y:a.tn?a.avg:null,tip:`${lab(k)}．${a.tn} 題計時．平均 ${fmtDur(a.avg)}／題`}));
  const tMax=niceTime(Math.max(...agg.map(x=>x.a.tn?x.a.avg:0),1));
  const A0=agg[0].a,A1=agg[agg.length-1].a;
  if(agg.length>1){
    const dAcc=Math.round(A1.acc*100)-Math.round(A0.acc*100);
    h+=`<p class="trend">${agg.length} 天．正確率 ${Math.round(A0.acc*100)}% → <b>${Math.round(A1.acc*100)}%</b>（${dAcc>=0?"+":""}${dAcc}）`+
      (A0.tn&&A1.tn?`．平均每題 ${fmtDur(A0.avg)} → <b>${fmtDur(A1.avg)}</b>（${A1.avg<=A0.avg?"快了":"慢了"} ${fmtDur(Math.abs(A1.avg-A0.avg))}）`:"")+`</p>`;
  }else h+=`<p class="trend">目前只有 1 天的紀錄，再練一天就能看到變化。</p>`;
  h+=`<div class="chartwrap"><div class="chtip" id="chtip"></div>
    <h3>正確率</h3>${lineChart(accPts,{max:100,ticks:[0,50,100],fmt:v=>Math.round(v)+"%",label:cat+" 每日正確率"})}
    <h3>平均每題時間</h3>${lineChart(tPts,{max:tMax,ticks:[0,tMax/2,tMax],fmt:v=>fmtDur(v),label:cat+" 每日平均每題時間"})}</div>`;
  return h;
}
function chartTip(e){
  const tip=document.getElementById("chtip");if(!tip)return;
  const t=e.target&&e.target.closest?e.target.closest("[data-tip]"):null;
  if(!t){tip.style.display="none";return}
  const wrap=tip.parentElement.getBoundingClientRect(),r=t.getBoundingClientRect();
  tip.textContent=t.dataset.tip;tip.style.left=(r.left+r.width/2-wrap.left)+"px";tip.style.top=(r.top+r.height/2-wrap.top)+"px";tip.style.display="block";
}
document.addEventListener("pointerover",chartTip);

/* ---------- 刷題統計：正確率與速度 ---------- */
function vStats(){
  const L=st.tlog||[],today=dayKey(now()),T=todayAgg();
  const pct=a=>a.n?Math.round(a.acc*100)+"%":"—",avg=a=>a.tn?fmtDur(a.avg):"—";
  let h=`${backHome}<h1>刷題統計</h1><p class="sub">每題從顯示到送出答案的時間；Part 6／7 以整個題組的時間平均到每一題</p>`;
  h+=`<h2>今天</h2><div class="kpis">
    <div class="kpi"><span>作答題數</span><b>${T.n}</b></div>
    <div class="kpi"><span>正確率</span><b>${pct(T)}</b></div>
    <div class="kpi"><span>平均每題</span><b>${avg(T)}</b></div>
    <div class="kpi"><span>作答總時間</span><b>${T.tn?fmtDur(T.ms):"—"}</b></div></div>`;
  const timed=L.filter(r=>r.ms!=null),recent=timed.slice(-10),R=aggTime(recent);
  if(recent.length){
    const diff=T.tn?R.avg-T.avg:0;
    h+=`<div class="speed">目前速度：最近 ${recent.length} 題平均 <b>${fmtDur(R.avg)}</b>／題，正確率 <b>${pct(R)}</b>${T.tn&&Math.abs(diff)>=1000?`．比今日平均${diff<0?"快":"慢"} ${fmtDur(Math.abs(diff))}`:""}</div>`;
  }
  h+=vTrend(L);
  const todays=L.filter(r=>dayKey(r.t)===today);
  if(todays.length){
    const cats={};todays.forEach(r=>{const c=tlogCat(r);(cats[c]=cats[c]||[]).push(r)});
    h+=`<h2>今天各科</h2><table class="stbl"><thead><tr><th>科目</th><th>題數</th><th>正確率</th><th>平均每題</th></tr></thead><tbody>`;
    Object.keys(cats).sort().forEach(c=>{const a=aggTime(cats[c]);h+=`<tr><td>${esc(c)}</td><td>${a.n}</td><td>${pct(a)}</td><td>${avg(a)}</td></tr>`});
    h+=`</tbody></table>`;
  }
  const days={};L.forEach(r=>{const k=dayKey(r.t);(days[k]=days[k]||[]).push(r)});
  const keys=Object.keys(days).sort().reverse().slice(0,14);
  if(keys.length){
    h+=`<h2>最近紀錄</h2><table class="stbl"><thead><tr><th>日期</th><th>題數</th><th>正確率</th><th>平均每題</th><th>總時間</th></tr></thead><tbody>`;
    keys.forEach(k=>{const a=aggTime(days[k]);h+=`<tr class="${k===today?"hl":""}"><td>${k.slice(5).replace("-","/")}${k===today?"（今天）":""}</td><td>${a.n}</td><td>${pct(a)}</td><td>${avg(a)}</td><td>${a.tn?fmtDur(a.ms):"—"}</td></tr>`});
    h+=`</tbody></table>`;
  }else h+=`<p style="margin-top:22px">還沒有計時紀錄。開始做題後，每題送出答案時會自動記錄用時。</p>`;
  h+=`<p class="note" style="margin-top:18px">計時規則：題目顯示時開始計時；切換到其他分頁或 App、或換到別題後再回來，會從 0 重新計時。抽考與每日 15 題也列入統計。清除作答紀錄或錯題重做不會刪除這裡的歷史，重做會再記一筆（可切換「只算第一次作答」）。紀錄保留 ${TLOG_DAYS} 天，並隨跨裝置同步。<br>多益常見的時間分配參考：Part 5 每題約 20–30 秒、Part 6 每題約 30–40 秒、Part 7 每題約 1 分鐘。</p>`;
  return h;
}

/* ---------- 同步設定 ---------- */
function vSync(){
  const on=Sync.on(),[s,label]=syncLabel();
  let h=`${backHome}<h1>跨裝置同步</h1>
  <p class="sub">作答紀錄存到你 GitHub 帳號的私人 Gist，手機、平板、電腦使用同一組 Token 即可接續。</p>
  <div class="panel" style="margin-top:22px">`;
  if(s==="err"&&Sync.msg)h+=`<div class="errbox">${esc(Sync.msg)}</div>`;
  if(on){
    h+=`<dl class="kv"><dt>狀態</dt><dd>${label}</dd><dt>上次同步</dt><dd>${Sync.cfg.last?fmtTime(Sync.cfg.last):"—"}</dd>
      ${Sync.cfg.gistId?`<dt>位置</dt><dd><a href="https://gist.github.com/${esc(Sync.cfg.gistId)}" target="_blank" rel="noopener">私人 Gist</a></dd>`:""}</dl>
      <div class="row-btns"><button class="btn primary" data-act="syncNow">立即同步</button><button class="btn" data-act="syncOff">停用此裝置</button></div>`;
  }else{
    h+=`<ol class="steps">
      <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=%E5%88%B7%E9%A1%8C%E7%9B%AE%E9%8C%84%E5%90%8C%E6%AD%A5" target="_blank" rel="noopener">建立 GitHub Token（classic）</a>，權限只勾 <code>gist</code>。</li>
      <li>複製 <code>ghp_</code> 開頭的字串，貼到下方。</li>
      <li>其他裝置貼上同一組 Token。</li></ol>
      <label class="field"><span>GitHub Token</span><input id="tok" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ghp_…"></label>
      <button class="btn primary" data-act="syncConnect">連線並同步</button>`;
  }
  h+=`</div><p class="note">Token 只存在這台裝置的瀏覽器，且只有 Gist 權限。請勿在公用電腦啟用。</p>
  <h2>手動備份</h2>
  <div class="row-btns"><button class="btn" data-act="exportData">複製備份碼</button><button class="btn" data-act="importData">匯入備份碼</button></div>
  <textarea id="bk" class="bk" placeholder="匯入時，把備份碼貼在這裡" spellcheck="false"></textarea>
  <p class="note" id="bkmsg"></p>`;
  return h;
}

function render(){
  if(st.view==="prac"&&!(st.pr&&st.pr.ids.length&&st.pr.ids.every(id=>QM[id])))st.view="home";  // 題庫鎖定時，AI 題目的抽考先回目錄
  if(st.view==="exam"&&!ALL.some(e=>e.id===st.exam))st.view="home";
  const isRead=st.view==="exam"&&(findEx(st.exam).part===7||findEx(st.exam).part===6);
  const v=isRead?vReading:({home:vHome,exam:vExam,pset:vPset,prac:vPrac,report:vReport,sync:vSync,stats:vStats,unlock:vUnlock}[st.view]||vHome);
  const pl=document.getElementById("paneL"),pr=document.getElementById("paneR");
  const keep=pl&&pr?{k:pl.dataset.key,l:pl.scrollTop,r:pr.scrollTop}:null;
  app.innerHTML=v();
  app.classList.toggle("readmode",isRead);document.body.classList.toggle("readmode",isRead);
  if(isRead){const nl=document.getElementById("paneL"),nr=document.getElementById("paneR");
    if(keep&&nl&&nl.dataset.key===keep.k){nl.scrollTop=keep.l;if(!p7ResetR)nr.scrollTop=keep.r}
    p7ResetR=false}
  renderTopbar();
  syncTimer();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toTop(){window.scrollTo(0,0)}
function qTop(){const el=app.querySelector(".panel");if(!el)return;
  const r=el.getBoundingClientRect();if(r.top<64||r.top>window.innerHeight*0.6)el.scrollIntoView({block:"start"})}
const p5Ids=base=>Object.keys(QM).filter(id=>{const e=QM[id].ex;return e.kind==="toeic"&&(e.part||5)===5&&(!base||(e.stage>=1&&e.stage<=3))});
// 每日 15 題：最多 3 題錯題複習，其餘優先出沒寫過的題目
function newDaily(base,n=15){
  const all=p5Ids(base),wr=shuffle(all.filter(isWrong)).slice(0,3),un=shuffle(all.filter(id=>st.ans[id]===undefined));
  const rest=shuffle(all.filter(id=>st.ans[id]!==undefined&&!wr.includes(id)));
  const ids=shuffle([...new Set([...wr,...un,...rest])].slice(0,n));
  return {ids,ans:{},i:0,src:"daily",base:!!base,scope:"toeic",timed:true,limit:360,start:now(),title:base?"基礎每日 15 題":"每日 15 題"};
}
function fmtDur(ms){const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function timerText(){const p=st.pr;if(!p||!p.timed)return "";const el=(p.end||now())-p.start,left=p.limit*1000-el;
  if(p.end)return "用時 "+fmtDur(el);return left>=0?"剩餘 "+fmtDur(left):"超時 "+fmtDur(-left)}
setInterval(()=>{
  const p=st.pr;if(st.view!=="prac"||!p||!p.timed||p.end)return;
  const t=document.getElementById("timer");if(t)t.textContent=timerText();
  if(!p.warned&&now()-p.start>=p.limit*1000){p.warned=true;persist();showToast("6 分鐘到！可以繼續寫完，但記得檢討速度")}
},1000);
function poolIds(pool){const w=wrongIds(),f=flagIds();
  return pool==="wrong"?w:pool==="flag"?f:pool==="both"?[...new Set([...w,...f])]:scopeIds()}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t||!(app.contains(t)||topbar.contains(t)))return;
  const d=t.dataset,a=d.act;
  if(d.scope)st.scope=d.scope;
  const ex=findEx(st.exam);let scroll=null;
  switch(a){
    case"go":st.view=d.v;scroll=toTop;break;
    case"open":st.view="exam";st.exam=d.ex;st.scope=exScope(findEx(d.ex));scroll=toTop;break;
    case"goto":st.cur[st.exam]=+d.i;scroll=qTop;break;
    case"pgoto":st.pr.i=+d.i;scroll=qTop;break;
    case"pick":{const k=+d.k,q=QM[d.id].q,pr=st.view==="prac";
      if(pr?st.pr.ans[d.id]!==undefined:st.ans[d.id]!==undefined)break;
      const ms=elapsedFor(pr?"p|"+d.id+"|"+st.pr.i:"q|"+d.id);
      if(pr){st.pr.ans[d.id]=k;if(!st.pr.end&&st.pr.ids.every(x=>st.pr.ans[x]!==undefined))st.pr.end=now()}else setAns(d.id,k);
      logTime(d.id,ms,okAns(q,k),{src:pr?"p":"e"});QT.key=null;break}
    case"optFirst":st.optFirst=!st.optFirst;break;
    case"flag":toggleFlag(d.id);break;
    case"copy":copyQuestion(d.id);return;
    case"daily":st.pr=newDaily(!!d.base);st.scope="toeic";st.view="prac";scroll=toTop;break;
    case"pstartAgain":{
      const p=st.pr||{};let ids=[];
      if(p.src==="pset"){st.scope=p.scope;ids=shuffle([...poolIds(p.pool)]).slice(0,p.n);
        if(!ids.length){st.view="pset";scroll=toTop;break}}
      else{st.pr=newDaily(p.base);st.view="prac";scroll=toTop;break}
      st.pr={...p,ids,ans:{},i:0};st.view="prac";scroll=toTop;break;
    }
    case"prev":if(st.view==="prac")st.pr.i--;else st.cur[st.exam]=(st.cur[st.exam]||0)-1;scroll=qTop;break;
    case"next":if(st.view==="prac")st.pr.i++;else st.cur[st.exam]=(st.cur[st.exam]||0)+1;scroll=qTop;break;
    case"report":st.view="report";scroll=toTop;break;
    case"pset":st.view="pset";scroll=toTop;break;
    case"presume":st.view="prac";scroll=toTop;break;
    case"pnum":{const inp=document.getElementById("pcount");inp.value=d.n==="999"?scopeIds().length:d.n;return}
    case"pstart":{
      const pool=(app.querySelector('input[name="pool"]:checked')||{}).value;
      const ids=pool?poolIds(pool):[];
      const n=parseInt(document.getElementById("pcount").value,10);
      if(!ids.length){document.getElementById("pmsg").textContent="這個範圍目前沒有題目。";return}
      if(!(n>0)){document.getElementById("pmsg").textContent="請輸入 1 以上的題數。";return}
      st.pr={ids:shuffle([...ids]).slice(0,n),ans:{},i:0,src:"pset",pool,n,scope:st.scope};st.view="prac";scroll=toTop;break}
    case"jump":{const {ex:x,i}=QM[d.id];st.view="exam";st.exam=x.id;st.scope=exScope(x);st.cur[x.id]=i;scroll=toTop;break}
    case"nextWrong":{const c=st.cur[ex.id]||0,n=ex.qs.length;let f=-1;
      for(let s=1;s<=n;s++){const i=(c+s)%n;if(isWrong(ex.id+"-"+i)){f=i;break}}
      if(f<0){showToast("本卷沒有錯題");return}st.cur[ex.id]=f;scroll=qTop;break}
    case"retryWrong":{let f=-1;ex.qs.forEach((q,i)=>{const id=ex.id+"-"+i;if(isWrong(id)){delAns(id);if(f<0)f=i}});
      if(f<0){showToast("本卷沒有錯題");return}st.cur[ex.id]=f;scroll=toTop;break}
    case"aiLock":if(!confirm("清除這台裝置記住的密碼並鎖定 AI 題庫？作答紀錄會保留。"))return;
      AILock.forget();location.reload();return;
    case"theme":applyTheme(d.v);renderTopbar();return;
    case"chartCat":st.chartCat=d.c;persist();render();return;
    case"chartFirst":st.chartFirst=d.v==="1";persist();render();return;
    case"jumpblank":{const el=document.getElementById("blank-"+d.n),pl=document.getElementById("paneL");
      if(el&&pl){pl.scrollTop+=el.getBoundingClientRect().top-pl.getBoundingClientRect().top-pl.clientHeight/3;el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1200)}return}
    case"jumpq":{const el=document.getElementById("rq-"+d.n),pr=document.getElementById("paneR");
      if(el&&pr){pr.scrollTop+=el.getBoundingClientRect().top-pr.getBoundingClientRect().top-8}return}
    case"p7pick":if(!st.p7d||typeof st.p7d!=="object")st.p7d={};st.p7d[d.id]=+d.k;persist();render();return;
    case"p7set":{if(+d.i<0)return;st.cur[st.exam]=+d.i;save();render();window.scrollTo(0,0);
      const l=document.getElementById("paneL"),r=document.getElementById("paneR");if(l)l.scrollTop=0;if(r)r.scrollTop=0;return}
    case"p7submit":{const sets=p7Sets(ex),cur=st.cur[ex.id]||0,set=sets.find(s=>s.idx.includes(cur))||sets[0];
      if(set.idx.some(i=>st.ans[ex.id+"-"+i]===undefined&&(st.p7d||{})[ex.id+"-"+i]===undefined))return;
      const ms=elapsedFor("set|"+ex.id+"|"+set.p),newIds=set.idx.map(i=>ex.id+"-"+i).filter(id=>st.ans[id]===undefined),per=ms!=null&&newIds.length?ms/newIds.length:null;
      newIds.forEach(id=>{setAns(id,st.p7d[id]);logTime(id,per,okAns(QM[id].q,st.p7d[id]),{src:"e",set:newIds.length,sm:ms==null?null:Math.round(ms)})});
      set.idx.forEach(i=>{delete st.p7d[ex.id+"-"+i]});QT.key=null;
      p7ResetR=true;save();render();const r=document.getElementById("paneR");if(r)r.scrollTop=0;return}
    case"p7redo":{const sets=p7Sets(ex),cur=st.cur[ex.id]||0,set=sets.find(s=>s.idx.includes(cur))||sets[0];
      if(!confirm("清除這個題組的作答，重新作答？"))return;
      set.idx.forEach(i=>{delAns(ex.id+"-"+i);if(st.p7d)delete st.p7d[ex.id+"-"+i]});p7ResetR=true;save();render();
      const r=document.getElementById("paneR");if(r)r.scrollTop=0;return}
    case"resetExam":if(!confirm(`確定清除「${ex.title}」的作答紀錄？標註會保留。`))return;
      ex.qs.forEach((q,i)=>{delAns(ex.id+"-"+i);if(st.p7d)delete st.p7d[ex.id+"-"+i]});st.cur[ex.id]=0;scroll=toTop;break;
    case"syncConnect":{
      const v=((document.getElementById("tok")||{}).value||"").trim();
      if(!v){showToast("請先貼上 Token");return}
      Sync.cfg={token:v,gistId:"",last:0};Sync.saveCfg();Sync.msg="";
      render();
      Sync.run().then(()=>{if(Sync.state==="ok")showToast("已連線並完成同步")});
      return;
    }
    case"syncNow":Sync.run().then(()=>{if(Sync.state==="ok")showToast("同步完成")});return;
    case"syncOff":if(!confirm("停用這台裝置的同步？本機與雲端紀錄都會保留。"))return;
      clearTimeout(Sync.timer);Sync.timer=null;Sync.cfg={token:"",gistId:"",last:0};Sync.saveCfg();Sync.state="off";Sync.msg="";break;
    case"exportData":{
      const code=JSON.stringify(payload());
      const ta=document.getElementById("bk");if(ta)ta.value=code;
      copyText(code,()=>showToast("備份碼已複製"));
      document.getElementById("bkmsg").textContent=`共 ${Object.keys(st.ans).length} 筆作答紀錄。`;
      return;
    }
    case"importData":{
      const msg=document.getElementById("bkmsg");
      let o;try{o=JSON.parse((document.getElementById("bk").value||"").trim())}catch(err){msg.textContent="備份碼格式不正確。";return}
      if(!o||typeof o.ans!=="object"){msg.textContent="這不是本系統的備份碼。";return}
      const before=Object.keys(st.ans).length;
      mergeRemote(o);persist();Sync.schedule(500);
      showToast(`匯入完成（${before} → ${Object.keys(st.ans).length} 筆）`);
      render();return;
    }
  }
  save();render();if(scroll)scroll();
});

  AILock.busy=true;AILock.msg="";render();
  try{await AILock.tryPassword(pw,rem);AILock.busy=false;st.view="home";st.open.ai=true;persist();render();toTop();showToast("已解鎖 AI應用規劃師題庫")}
  catch(err){AILock.busy=false;AILock.msg="密碼不正確，請再試一次。";render();const i=document.getElementById("aipw");if(i)i.focus()}
});

// 記住資料夾與答案卡的展開狀態
document.addEventListener("toggle",e=>{
  const el=e.target;if(!el||!el.classList)return;
  if(el.classList.contains("folder")){st.open[el.dataset.key]=el.open;persist()}
  else if(el.classList.contains("sheet")){st.sheetOpen=el.open;persist()}
},true);

document.addEventListener("visibilitychange",()=>{
  if(!Sync.on())return;
  if(document.visibilityState==="visible")Sync.run();else Sync.flush();
});
window.addEventListener("pagehide",()=>Sync.flush());
window.addEventListener("online",()=>{if(Sync.on())Sync.run()});
setInterval(()=>{if(Sync.on()&&document.visibilityState==="visible"&&!Sync.timer&&!Sync.busy)Sync.run()},120000);

Sync.loadCfg();
app.innerHTML='<p class="note" style="padding:40px 0;text-align:center">題庫載入中…</p>';
loadData().then(()=>{
  DATA_READY=true;
  load();prevCur={...st.cur};
  render();
  if(Sync.on())Sync.run();
}).catch(err=>{
  const local=location.protocol==="file:";
  app.innerHTML=`<div class="errbox" style="margin:40px 0;line-height:1.8"><b>題庫載入失敗</b><br>${local
    ?"直接雙擊開啟 index.html 時，瀏覽器不允許讀取 data 資料夾。請改用 GitHub Pages 網址，或在這個資料夾執行 <code>python -m http.server 8000</code> 後開啟 http://localhost:8000 。"
    :"請檢查網路後重新整理。若剛更新網站，可能是 data 資料夾還沒上傳完整。"}<br><span class="note">${esc(err&&err.message||err)}</span></div>`;
});

</script>
</body>
