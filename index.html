<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<script>try{var __t=localStorage.getItem("quiz-theme");if(__t==="light"||__t==="dark")document.documentElement.setAttribute("data-theme",__t)}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷題小工具</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="刷題目錄">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#111111; --muted:#6B6B6B; --faint:#A3A3A3; --line:#E7E7E7; --soft:#F6F6F6;
  --mid:#9A9A9A; --on-ink:#FFFFFF; --hl:rgba(250,204,21,.38);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F0F; --ink:#F2F2F2; --muted:#A3A3A3; --faint:#666666; --line:#262626; --soft:#181818;
    --mid:#5C5C5C; --on-ink:#0F0F0F; --hl:rgba(250,204,21,.26); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F0F; --ink:#F2F2F2; --muted:#A3A3A3; --faint:#666666; --line:#262626; --soft:#181818;
  --mid:#5C5C5C; --on-ink:#0F0F0F; --hl:rgba(250,204,21,.26); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.7;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--ink);text-underline-offset:3px}
svg{flex:none;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px calc(80px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){.wrap{padding:44px 32px 96px}}

/* 頂列 */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 16px}
@media (min-width:768px){.topbar-in{padding:0 32px}}
.tb-left{display:flex;align-items:center;gap:6px;min-width:0}
.menubtn{appearance:none;border:0;background:none;width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:8px;cursor:pointer;color:var(--ink)}
.menubtn:hover{background:var(--soft)}
.tb-menu{margin-left:-8px}
/* 頂列工具：錯題分析／錯題抽考／刷題統計；窄螢幕改放在側邊選單 */
.tb-nav{display:none;flex:1;justify-content:center;gap:18px}
.tb-nav button{appearance:none;border:0;border-bottom:2px solid transparent;background:none;padding:6px 0 4px;cursor:pointer;font-size:.84rem;color:var(--muted);white-space:nowrap}
.tb-nav button:hover{color:var(--ink)}
.tb-nav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.tb-badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-size:.68rem;font-weight:600;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.side-item.on .tb-badge{background:var(--on-ink);color:var(--ink)}
.side-tools{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
@media (min-width:760px){.tb-nav{display:flex}.side-tools{display:none}}
/* 側邊欄展開時頂列較擠：同步只留圓點（滑鼠移上去看狀態） */
@media (min-width:900px) and (max-width:1180px){body:not(.side-min) .syncbtn span{display:none}}
/* 筆記複習清單 */
.nlist{list-style:none;margin:6px 0 0;padding:0}
.nlist li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.nlist .nsnip{margin:2px 0 0;font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nlist .nsnip>*{display:inline;margin:0;font-size:inherit}
/* 側邊欄：TOEIC／站長自用；寬螢幕固定在左側可收合，窄螢幕從左側滑出 */
.side{position:fixed;top:0;left:0;bottom:0;z-index:60;width:216px;background:var(--bg);border-right:1px solid var(--line);padding:env(safe-area-inset-top,0px) 10px 16px;display:flex;flex-direction:column;gap:4px;overflow:hidden;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility 0s .2s}
body.side-open .side{transform:none;visibility:visible;transition:transform .2s ease}
.side-head{height:57px;flex:none;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);margin:0 -10px 8px;padding:0 12px}
.side-title{font-size:.78rem;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.side-item{appearance:none;border:0;background:none;display:flex;align-items:center;gap:12px;width:100%;min-height:42px;padding:8px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:.92rem;text-align:left;white-space:nowrap;overflow:hidden}
.side-item:hover{background:var(--soft);color:var(--ink)}
.side-item.on{background:var(--ink);color:var(--on-ink)}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .2s ease}
body.side-open .scrim{opacity:1;pointer-events:auto}
@media (min-width:900px){
  body{padding-left:216px}
  .side{transform:none;visibility:visible;transition:none}
  body.side-min{padding-left:60px}
  body.side-min .side{width:60px}
  body.side-min .side .lbl{display:none}
  .tb-menu,.scrim{display:none}
}
.brand{appearance:none;border:0;background:none;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:.98rem;letter-spacing:.02em}
.syncbtn{appearance:none;border:0;background:none;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);white-space:nowrap}
.syncbtn:hover{color:var(--ink)}
.tb-right{display:flex;align-items:center;gap:14px}
.themesw{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.themesw button{appearance:none;border:0;background:none;color:var(--muted);font-size:.74rem;padding:3px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
.themesw button:hover{color:var(--ink)}
.themesw button.on{background:var(--ink);color:var(--on-ink)}
@media (max-width:420px){.themesw button{padding:3px 7px;font-size:.7rem}.tb-right{gap:10px}.syncbtn{font-size:.74rem}}
/* Part 7 閱讀分欄 */
body.readmode{overflow:hidden}
body.readmode .topbar-in{max-width:1320px}
.wrap.readmode{max-width:1320px;padding:14px 24px 14px;height:calc(100vh - 57px);height:calc(100dvh - 57px - env(safe-area-inset-top,0px));display:flex;flex-direction:column}
.rhead{flex:none;margin-bottom:10px}
.rhead .back{margin-bottom:6px}
.rhead h1{font-size:1.2rem;margin:0 0 8px}
.setnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.setchip{appearance:none;flex:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:.78rem;cursor:pointer;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px;align-items:center}
.setchip small{font-size:.72rem}
.setchip.done{color:var(--ink);border-color:var(--faint)}
.setchip.cur{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.reading{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px}
.pane-l,.pane-r{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.pane-l{background:var(--soft)}
.pane-title{margin:0 0 12px;font-size:.75rem;letter-spacing:.06em;color:var(--muted)}
.doc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;font-size:.95rem;line-height:1.85}
.doc .p-body{white-space:pre-line}
.rq{padding:4px 0 18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.rq:last-of-type{border-bottom:0}
.rq-text{font-size:1rem;margin:0 0 12px}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pane-l .blank{cursor:pointer}
.dirs{margin:0 0 14px;font-size:.8rem;line-height:1.6;color:var(--muted);font-style:italic}
.pane-title{font-size:.9rem!important;letter-spacing:0!important;color:var(--ink)!important;font-weight:700;margin:0 0 10px!important}
.blank6{cursor:pointer;white-space:nowrap;letter-spacing:.06em;color:var(--ink)}
.blank6.flash,.blank.flash{background:var(--ink);color:var(--on-ink)}
.bn{font-size:.68em;font-weight:700;margin-right:2px;letter-spacing:0}
.optl{flex:none;min-width:2.2em;font-weight:600;color:var(--muted)}
.opt.sel .optl,.opt.right .optl{color:var(--ink)}
.opt.wrong .optl{color:var(--muted)}
.pane-l .blank.pick,.pane-l .blank.done{display:inline;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pane-l .blank.pick{min-width:0;color:var(--ink);font-size:.9em;border-bottom:2px solid var(--ink);text-align:left}
.pane-l .blank.done{min-width:0;font-size:.92em;border-bottom:2px solid var(--ink);color:var(--ink);text-align:left}
.pane-l .blank.done.miss{border-bottom-style:dashed}
.pane-l .blank.flash{background:var(--ink);color:var(--on-ink)}
.qlocate{font-weight:700;color:var(--ink);font-size:.9rem;text-decoration-color:var(--faint)}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.submitbar{position:sticky;bottom:-16px;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:4px}
.pane-r .result{margin:0 0 4px}
.pane-r .nav{margin-top:14px}
.pane-r .tools{margin-top:16px}
/* 檢討時右側切換「題目檢討／全文翻譯」；.sg 是逐句對照的一句，兩側同一句一起標示 */
.ptabs{position:sticky;top:-16px;z-index:2;display:flex;gap:6px;margin:-16px -18px 14px;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.ptabs button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:.85rem;cursor:pointer}
.ptabs button.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.trhint{margin:0 0 12px}
.trdoc{background:var(--soft)}
.sg{border-radius:3px;transition:background-color .12s,box-shadow .12s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sg.on{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
@media (max-width:860px){
  .wrap.readmode{padding:10px 12px 10px}
  .rhead h1{font-size:1.05rem;margin-bottom:6px}
  .reading{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .pane-l,.pane-r{padding:12px 14px}
  .ptabs{top:-12px;margin:-12px -14px 12px;padding:8px 14px}
  .doc{padding:12px;font-size:.92rem}
}
.syncdot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--faint)}
.syncbtn[data-s="ok"] .syncdot,.syncbtn[data-s="idle"] .syncdot{background:var(--ink);border-color:var(--ink)}
.syncbtn[data-s="busy"] .syncdot,.syncbtn[data-s="pending"] .syncdot{background:var(--faint);border-color:var(--faint)}
.syncbtn[data-s="err"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px} .syncbtn[data-s="err"] .syncdot{background:var(--ink);border-color:var(--ink)}

/* 標題 */
h1{font-size:1.5rem;line-height:1.35;margin:0 0 6px;font-weight:700;letter-spacing:.01em}
h2{font-size:1rem;margin:36px 0 12px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.back{appearance:none;border:0;background:none;padding:0;margin:0 0 18px;cursor:pointer;color:var(--muted);font-size:.88rem;display:inline-flex;align-items:center;gap:4px}
.back:hover{color:var(--ink)}
.note{font-size:.85rem;color:var(--muted)}

/* 目錄樹 */
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree{margin-top:28px;border-top:1px solid var(--line)}
.tree>li{border-bottom:1px solid var(--line)}
.tree ul{margin:0 0 10px 9px;padding-left:18px;border-left:1px solid var(--line)}
.folder>summary{list-style:none}
.folder>summary::-webkit-details-marker{display:none}
.row{appearance:none;border:0;background:none;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 6px;border-radius:6px}
.row:hover{background:var(--soft)}
.row .name{flex:1;min-width:0}
.row .meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .meta b{color:var(--ink);font-weight:600}
.row .meta .bad{color:var(--ink)}
.row .chev{width:16px;height:16px;color:var(--faint);transition:transform .2s ease}
.folder[open]>summary .chev{transform:rotate(90deg)}
.tree>li>.folder>summary{min-height:60px;font-size:1.08rem;font-weight:700}
.row.off{cursor:default;color:var(--faint)} .row.off:hover{background:none}
.row.done .name::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-left:8px;vertical-align:2px}

/* 答案卡 */
.sheet{margin:22px 0 16px;border:1px solid var(--line);border-radius:10px;padding:0 16px}
.sheet>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;font-size:.88rem}
.sheet>summary::-webkit-details-marker{display:none}
.sheet>summary .t{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sheet>summary .chev{width:14px;height:14px;color:var(--faint);transition:transform .2s ease}
.sheet[open]>summary .chev{transform:rotate(90deg)}
.sheet>summary .score{color:var(--muted);font-variant-numeric:tabular-nums}
.sheet[open]{padding-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.cell{position:relative;appearance:none;height:38px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.cell:not(.ok):not(.bad):hover{border-color:var(--ink);color:var(--ink)}
.cell.ok{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.cell.bad{background:var(--mid);border-color:var(--mid);color:#fff}
.cell.cur{outline:2px solid var(--ink);outline-offset:2px}
.cell.fl::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.76rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* 題目 */
.panel{border:1px solid var(--line);border-radius:10px;padding:20px;scroll-margin-top:72px}
@media (min-width:768px){.panel{padding:26px 28px}}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qno{font-weight:700;font-size:.9rem;color:var(--ink);display:flex;align-items:center;gap:10px}
.chip{font-weight:400;font-size:.78rem;color:var(--muted)}
.qactions{display:flex;gap:6px}
.copybtn,.flagbtn{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:3px 12px;font-size:.78rem;cursor:pointer}
.copybtn:hover,.flagbtn:hover{border-color:var(--ink);color:var(--ink)}
.copybtn.copied{border-color:var(--ink);color:var(--ink)}
.flagbtn.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.qtext{font-size:1.1rem;line-height:1.8;margin:0 0 20px;font-weight:600;white-space:pre-line}
.opts+.optfirst-q{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.src{font-size:.8rem;color:var(--muted);margin:-12px 0 16px}
.passage{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 18px;background:var(--soft);font-size:.95rem;line-height:1.85}
.p-kind{margin:0 0 8px;font-size:.75rem;letter-spacing:.06em;color:var(--muted)}
.p-head{margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);white-space:pre-line;font-size:.86rem;color:var(--muted)}
.p-body{white-space:pre-line}
.blank{display:inline-block;min-width:4.5em;padding:0 4px;border-bottom:1px solid var(--faint);color:var(--muted);font-size:.85em;text-align:center}
.blank.cur{border-bottom:2px solid var(--ink);color:var(--ink);font-weight:700;background:var(--bg)}
.blank.done{min-width:0;color:var(--ink);font-size:1em;border-bottom-style:dotted;text-align:left}
.ptrans{margin-top:12px} .ptrans summary{cursor:pointer;color:var(--muted);font-size:.85rem} .ptrans p{margin:6px 0 0;font-size:.9rem;line-height:1.75;color:var(--muted)}
@media (max-width:560px){.passage{padding:14px;font-size:.92rem}}
.opts{display:grid;gap:8px}
.opt{appearance:none;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px;cursor:pointer;min-height:48px;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.78rem;font-weight:600;color:var(--muted);margin-top:1px}
.opt.right{border-color:var(--ink)}
.opt.right .bub{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.opt.wrong{border-color:var(--mid);background:var(--soft)}
.opt.wrong>span:last-child{text-decoration:line-through;text-decoration-color:var(--mid);color:var(--muted)}
.opt.wrong .bub{background:var(--mid);border-color:var(--mid);color:#fff}
.opt:disabled:not(.right):not(.wrong){color:var(--muted)}
.hint{margin-top:16px} .hint summary{cursor:pointer;color:var(--muted);font-size:.85rem} .hint p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.exp{margin-top:22px;padding:2px 0 2px 16px;border-left:2px solid var(--ink)}
.exp.isbad{border-left-color:var(--mid)}
.verdict{font-weight:700;margin:0 0 10px}

.qtrans{background:var(--soft);padding:10px 14px;margin:10px 0 12px;border-radius:6px;font-size:.93rem;line-height:1.65}
.qexp-text{margin:0 0 10px;line-height:1.75}
.qopt-breakdown{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.9rem;line-height:1.7;color:var(--muted)}
.qopt-breakdown strong,.qtrans strong{color:var(--ink)}
/* 檢討筆記 */
.notebox{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.note-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.note-head strong{font-size:.9rem}
.note-head .note{flex:1;font-size:.76rem;color:var(--faint)}
.note-head .linkbtn{margin-left:auto}
.note-in{display:block;width:100%;min-height:84px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;line-height:1.6}
.note-in:focus{border-color:var(--ink);outline:0}
.note-pv{margin-top:8px;padding:10px 12px;border-radius:8px;background:var(--soft)}
.note-keys{margin-top:6px;font-size:.76rem;color:var(--faint)}
.note-keys summary{cursor:pointer;width:max-content}

/* ---------- 跨裝置同步（GitHub Gist） ---------- */
const SYNC_KEY="quiz-sync-v1", GIST_FILE="quiz-progress.json", GIST_DESC="刷題學習系統｜作答紀錄同步（請勿刪除）";
function payload(){return {app:"quiz-sync",v:1,optv:1,updatedAt:now(),ans:st.ans,ansT:st.ansT,flags:st.flags,flagT:st.flagT,cur:st.cur,curT:st.curT,notes:st.notes,noteT:st.noteT,nrev:st.nrev,nrevT:st.nrevT,tlog:st.tlog||[]}}
function stable(o){if(o===null||typeof o!=="object")return JSON.stringify(o);if(Array.isArray(o))return "["+o.map(stable).join(",")+"]";
  return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}"}
const dataKey=o=>stable({ans:o.ans||{},ansT:o.ansT||{},flags:o.flags||{},flagT:o.flagT||{},cur:o.cur||{},curT:o.curT||{},notes:o.notes||{},noteT:o.noteT||{},nrev:o.nrev||{},nrevT:o.nrevT||{},tl:Array.isArray(o.tlog)?o.tlog.length:0,tt:Array.isArray(o.tlog)&&o.tlog.length?o.tlog[o.tlog.length-1].t:0});
function mergeTlog(r){if(!Array.isArray(r)||!r.length)return false;if(!Array.isArray(st.tlog))st.tlog=[];
  const seen=new Set(st.tlog.map(x=>x.t+"|"+x.id));let ch=false;
  r.forEach(x=>{if(x&&x.t&&x.id&&!seen.has(x.t+"|"+x.id)){st.tlog.push(x);seen.add(x.t+"|"+x.id);ch=true}});
  if(ch){st.tlog.sort((a,b)=>a.t-b.t);pruneTlog()}return ch}
function mergeMap(lv,lt,rv,rt){
  let ch=false;rv=rv||{};rt=rt||{};
  new Set([...Object.keys(lt),...Object.keys(rt),...Object.keys(lv),...Object.keys(rv)]).forEach(k=>{
    const a=lt[k]||0,b=rt[k]||0;
    if(b>a||(b===a&&lv[k]===undefined&&rv[k]!==undefined)){
      if(rv[k]===undefined){if(lv[k]!==undefined){delete lv[k];ch=true}}
      else if(lv[k]!==rv[k]){lv[k]=rv[k];ch=true}
      if(b)lt[k]=b;
    }
  });
  return ch;
}
function mergeRemote(r){
  if(!r||typeof r!=="object")return false;
  if(remapOpts(r))r._migrated=true;
  if(migrateData(r))r._migrated=true;
  let ch=mergeMap(st.ans,st.ansT,r.ans,r.ansT);
  ch=mergeMap(st.flags,st.flagT,r.flags,r.flagT)||ch;
  ch=mergeMap(st.cur,st.curT,r.cur,r.curT)||ch;
  ch=mergeMap(st.notes,st.noteT,r.notes,r.noteT)||ch;
  ch=mergeMap(st.nrev,st.nrevT,r.nrev,r.nrevT)||ch;
  ch=mergeTlog(r.tlog)||ch;
  prevCur={...st.cur};
  return ch;
}

const Sync={
  cfg:{token:"",gistId:"",last:0}, state:"off", msg:"", busy:false, again:false, timer:null,
  loadCfg(){try{Object.assign(this.cfg,JSON.parse(localStorage.getItem(SYNC_KEY)||"{}"))}catch(e){}this.state=this.cfg.token?"idle":"off"},
  saveCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(this.cfg))}catch(e){}},
  on(){return DATA_READY&&!!this.cfg.token},
  async api(path,opt={}){
    let r;
    try{
      r=await fetch("https://api.github.com"+path,{...opt,cache:"no-store",headers:{
        "Accept":"application/vnd.github+json","Authorization":"Bearer "+this.cfg.token,
        ...(opt.body?{"Content-Type":"application/json"}:{})}});
    }catch(e){throw new Error("無法連線到 GitHub，請確認網路")}
    if(r.status===401){const e=new Error("Token 無效或已過期，請重新設定");e.code=401;throw e}
    if(r.status===404){const e=new Error("找不到同步用的 Gist");e.code=404;throw e}
    if(r.status===403||r.status===429)throw new Error("GitHub 拒絕請求：Token 需要 gist 權限，或暫時超過使用額度");
    if(!r.ok)throw new Error("GitHub 回應錯誤（"+r.status+"）");
    return r.status===204?null:r.json();
  },
  async findOrCreate(){
    for(let page=1;page<=10;page++){
      const list=await this.api(`/gists?per_page=100&page=${page}`);
      const g=(list||[]).find(g=>g.files&&g.files[GIST_FILE]);
      if(g)return g.id;
      if(!list||list.length<100)break;
    }
    const g=await this.api("/gists",{method:"POST",body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
    return g.id;
  },
  async pull(){
    const g=await this.api("/gists/"+this.cfg.gistId);
    const f=g&&g.files&&g.files[GIST_FILE];
    if(!f)return null;
    let txt=f.content;
    if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text()}
    try{return JSON.parse(txt)}catch(e){return null}
  },
  async push(){
    await this.api("/gists/"+this.cfg.gistId,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
  },
  schedule(delay=2500){
    if(!this.on())return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>{this.timer=null;this.run()},delay);
    if(!this.busy)this.setState("pending");
  },
  flush(){if(this.timer){clearTimeout(this.timer);this.timer=null;this.run()}},
  async run(){
    if(!this.on())return;
    if(this.busy){this.again=true;return}
    this.busy=true;this.setState("busy");
    let changed=false;
    try{
      if(!this.cfg.gistId){this.cfg.gistId=await this.findOrCreate();this.saveCfg()}
      let remote;
      try{remote=await this.pull()}
      catch(e){if(e.code!==404)throw e;this.cfg.gistId=await this.findOrCreate();this.saveCfg();remote=await this.pull()}
      changed=mergeRemote(remote);
      if(!remote||remote._migrated||dataKey(remote)!==dataKey(st))await this.push();
      this.cfg.last=now();this.saveCfg();persist();
      this.msg="";this.state="ok";
    }catch(e){
      this.msg=e.message||String(e);this.state="err";
      if(e.code===401){this.cfg={token:"",gistId:"",last:0};this.saveCfg()}
    }
    this.busy=false;
    if(changed||st.view==="sync")render();else renderTopbar();
    if(this.again){this.again=false;this.run()}
  },
  setState(s){this.state=s;renderTopbar()}
};

  return d.toDateString()===n.toDateString()?hm:(d.getMonth()+1)+"/"+d.getDate()+" "+hm;
}

/* ---------- 工具（頂列）：對外固定 TOEIC；站長沿用目前的科目，在錯題分析／抽考頁再切換 ---------- */
const TOOLS=[["report","錯題分析"],["pset","錯題抽考"],["notes","筆記複習"],["stats","刷題統計"]];

function fallbackCopy(text,cb){

  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";

}
function passageHtml(ex,q,ansMap){
  const P=(ex.passages||[])[q.p];if(!P)return "";

  }
  const body=esc(P.text).replace(/\{\{(\d+)\}\}/g,(m0,n)=>{n=+n;
    const qi=ex.qs.findIndex(x=>x.n===n),qq=ex.qs[qi],a=ansMap[ex.id+"-"+qi];
    if(n===q.n)return `<span class="blank cur">(${n})</span>`;
    if(qq&&a!==undefined)return `<span class="blank done">${esc(qq.o[qq.a])}</span>`;
    return `<span class="blank">(${n})</span>`});
  return `<div class="passage"><p class="p-kind">${esc(P.kind||"")}</p>${P.head?`<p class="p-head">${esc(P.head)}</p>`:""}<div class="p-body">${body}</div></div>`;
}

/* ---------- 檢討筆記：Markdown（marked）＋LaTeX（KaTeX），第一次顯示筆記時才從 CDN 載入 ---------- */
const MD={ok:false,p:null,
  CSS:"https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css",
  JS:["https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js","https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js","https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"],
  // 先保護程式碼與 \$，再取出 $$…$$、\[…\]、\(…\)、$…$（$ 後接數字不算，避免 $50 被當成公式）
  RE:/(```[\s\S]*?```|`[^`\n]*`|\\\$)|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\s$](?:[^$\n]*?[^\s$])?)\$(?!\d)/g,
  load(){
    if(this.p)return this.p;
    const css=document.createElement("link");css.rel="stylesheet";css.href=this.CSS;document.head.appendChild(css);
    const js=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error(src));document.head.appendChild(s)});
    this.p=Promise.all(this.JS.map(js)).then(()=>{this.ok=true}).catch(e=>{this.p=null;throw e});
    return this.p;
  },
  html(src){
    const math=[];
    const s=src.replace(this.RE,(m,code,a,b,c,d)=>{if(code!==undefined)return m;
      const disp=a!==undefined||b!==undefined;math.push([a!==undefined?a:b!==undefined?b:c!==undefined?c:d,disp]);return "@@M"+(math.length-1)+"@@"});
    return DOMPurify.sanitize(marked.parse(s,{gfm:true,breaks:true}))
      .replace(/@@M(\d+)@@/g,(m,i)=>katex.renderToString(math[i][0],{displayMode:math[i][1],throwOnError:false}));
  }
};
function renderMd(el,src){
  el._src=src;
  if(!src.trim()){el.innerHTML="";return}
  if(MD.ok){el.classList.remove("md-plain");el.innerHTML=MD.html(src);return}
  el.classList.add("md-plain");el.textContent=src;  // 載入前或離線時先顯示原文
  MD.load().then(()=>{if(el.isConnected)renderMd(el,el._src)}).catch(()=>{});
}

/* ---------- 筆記快捷鍵：對照 Heptabase（wiki.heptabase.com/keyboard-shortcuts），Mac 用 Cmd、Windows 用 Ctrl ----------
   行內：B 粗體、I 斜體、E 行內程式碼、K 連結、Shift+S 刪除線、Shift+E 行內公式、Shift+H 螢光標記
   區塊（Mac：Cmd+Option＋數字；Windows：Ctrl+Shift＋數字）：0 一般文字、1–3 標題、4 待辦、5 項目符號、6 編號、8 程式碼區塊、9 公式區塊
   其他：Cmd/Ctrl+Enter 勾選待辦、Tab／Shift+Tab 清單縮排、Cmd/Ctrl+D 複製這一行、Cmd/Ctrl+Shift+↑↓ 移動行、Enter 自動延續清單 */
const IS_MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const NOTE_KEYS=[["粗體","B"],["斜體","I"],["行內程式碼","E"],["連結","K"],["刪除線","Shift+S"],["行內公式","Shift+E"],["螢光標記","Shift+H"],
  ["一般文字",null,"0"],["標題 1／2／3",null,"1／2／3"],["待辦清單",null,"4"],["項目符號",null,"5"],["編號清單",null,"6"],["程式碼區塊",null,"8"],["公式區塊",null,"9"],
  ["勾選／取消待辦","Enter"],["清單縮排／取消","Tab／Shift+Tab",null,true],["複製這一行","D"],["上移／下移這一行","Shift+↑／↓"]];
function noteKeysHtml(){
  const mod=IS_MAC?"⌘":"Ctrl",blk=IS_MAC?"⌘+⌥+":"Ctrl+Shift+";
  return `<details class="note-keys"><summary>快捷鍵</summary><ul>${NOTE_KEYS.map(([n,k,b,raw])=>`<li><span>${n}</span><kbd>${raw?k:b!==undefined&&b!==null?blk+b:mod+"+"+k}</kbd></li>`).join("")}</ul></details>`;
}
// 改寫 [s,e) 的文字並保留復原紀錄（execCommand 會觸發 input 事件，筆記照常存檔）
function taReplace(ta,s,e,text,selS,selE){
  ta.focus();ta.setSelectionRange(s,e);
  let ok=false;try{ok=document.execCommand("insertText",false,text)}catch(_){}
  if(!ok||ta.value.slice(s,s+text.length)!==text){ta.setRangeText(text,s,e,"end");ta.dispatchEvent(new Event("input",{bubbles:true}))}
  ta.setSelectionRange(selS,selE);
}
// 行內標記：已包住就移除，否則包起來
function taWrap(ta,L,R){
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd,sel=v.slice(s,e);
  // 斜體與粗體共用 *：連續星號數為奇數（* 或 ***）才算有斜體，避免把 **粗體** 誤判成斜體
  const stars=(str,fromEnd)=>{let n=0;for(let i=0;i<str.length;i++){if(str[fromEnd?str.length-1-i:i]==="*")n++;else break}return n};
  const solo=L==="*",okStar=(a,b)=>!solo||(a%2===1&&b%2===1);
  const outside=s>=L.length&&v.slice(s-L.length,s)===L&&v.slice(e,e+R.length)===R&&okStar(stars(v.slice(0,s),true),stars(v.slice(e),false));
  if(outside){taReplace(ta,s-L.length,e+R.length,sel,s-L.length,e-L.length);return}
  if(sel.length>=L.length+R.length&&sel.startsWith(L)&&sel.endsWith(R)&&okStar(stars(sel,false),stars(sel,true))){
    const inner=sel.slice(L.length,sel.length-R.length);taReplace(ta,s,e,inner,s,s+inner.length);return}
  taReplace(ta,s,e,L+sel+R,s+L.length,s+L.length+sel.length);
}
function taLink(ta){
  const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e)||"連結文字",t=`[${sel}](https://)`;
  taReplace(ta,s,e,t,s+sel.length+3,s+t.length-1);
}
// 目前選取範圍涵蓋的整行
function taLines(ta){
  const v=ta.value,s=ta.selectionStart;let e=ta.selectionEnd;
  if(e>s&&v[e-1]==="\n")e--;
  const ls=v.lastIndexOf("\n",s-1)+1,ni=v.indexOf("\n",e),le=ni<0?v.length:ni;
  return {ls,le,lines:v.slice(ls,le).split("\n")};
}
const BLOCK_RE=/^(\s*)(#{1,6}\s+|[-*+]\s+\[[ xX]\]\s+|[-*+]\s+|\d+[.)]\s+|>\s?)?/;
function taBlock(ta,n){
  const {ls,le,lines}=taLines(ta),body=lines.join("\n");
  if(n===8||n===9){const f=n===8?"```":"$$",t=`${f}\n${body}\n${f}`;taReplace(ta,ls,le,t,ls+f.length+1,ls+f.length+1+body.length);return}
  const pre={1:"# ",2:"## ",3:"### ",4:"- [ ] ",5:"- ",6:null}[n];
  const strip=l=>{const m=BLOCK_RE.exec(l);return {ind:m[1],txt:l.slice(m[0].length),cur:m[2]||""}};
  const ps=lines.map(strip);
  const same=n>=1&&n<=5&&ps.every(p=>p.cur.trim()===pre.trim()||(n===4&&/^[-*+]\s+\[[ xX]\]/.test(p.cur)));
  const out=ps.map((p,i)=>n===0||same?p.ind+p.txt:p.ind+(n===6?`${i+1}. `:pre)+p.txt).join("\n");
  taReplace(ta,ls,le,out,ls,ls+out.length);
}
function taTodo(ta){
  const {ls,le,lines}=taLines(ta);
  if(!lines.some(l=>/^\s*[-*+]\s+\[[ xX]\]/.test(l)))return false;
  const out=lines.map(l=>l.replace(/^(\s*[-*+]\s+\[)([ xX])(\])/,(m,a,c,b)=>a+(c===" "?"x":" ")+b)).join("\n");
  const s=ta.selectionStart,e=ta.selectionEnd;taReplace(ta,ls,le,out,s,e);return true;
}
function taIndent(ta,back){
  const {ls,le,lines}=taLines(ta);
  if(!lines.every(l=>!l.trim()||/^\s*([-*+]\s|\d+[.)]\s)/.test(l)))return false; // 只在清單裡攔截 Tab，其他地方照常移動焦點
  const out=lines.map(l=>back?l.replace(/^( {1,2}|\t)/,""):(l.trim()?"  "+l:l)).join("\n");
  taReplace(ta,ls,le,out,ls,ls+out.length);return true;
}
function taDup(ta){
  const {ls,le}=taLines(ta),blk=ta.value.slice(ls,le),s=ta.selectionStart,e=ta.selectionEnd,d=blk.length+1;
  taReplace(ta,le,le,"\n"+blk,s+d,e+d);
}
function taMove(ta,up){
  const v=ta.value,{ls,le}=taLines(ta),blk=v.slice(ls,le),s=ta.selectionStart,e=ta.selectionEnd;
  if(up){if(ls===0)return;const ps=v.lastIndexOf("\n",ls-2)+1,prev=v.slice(ps,ls-1);
    taReplace(ta,ps,le,blk+"\n"+prev,s-(ls-ps),e-(ls-ps))}
  else{if(le>=v.length)return;const ni=v.indexOf("\n",le+1),ne=ni<0?v.length:ni,next=v.slice(le+1,ne);
    taReplace(ta,ls,ne,next+"\n"+blk,s+next.length+1,e+next.length+1)}
}
// Enter 延續清單；空的清單項目按 Enter 就結束清單
function taEnter(ta){
  const v=ta.value,s=ta.selectionStart;if(s!==ta.selectionEnd)return false;
  const ls=v.lastIndexOf("\n",s-1)+1,line=v.slice(ls,s);
  const m=/^(\s*)([-*+]\s+\[[ xX]\]\s+|[-*+]\s+|(\d+)([.)])\s+)/.exec(line);if(!m)return false;
  if(!line.slice(m[0].length).trim()&&!v.slice(s,(v.indexOf("\n",s)+1||v.length+1)-1).trim()){taReplace(ta,ls,s,"",ls,ls);return true}
  const next=m[3]?`${+m[3]+1}${m[4]} `:/\[[ xX]\]/.test(m[2])?m[2].replace(/\[[xX]\]/,"[ ]"):m[2];
  const t="\n"+m[1]+next;taReplace(ta,s,s,t,s+t.length,s+t.length);return true;
}
document.addEventListener("keydown",e=>{
  const ta=e.target;if(!ta.classList||!ta.classList.contains("note-in"))return;
  if(e.isComposing||e.keyCode===229)return; // 注音／中文輸入法選字中不攔截
  const mod=IS_MAC?e.metaKey&&!e.ctrlKey:e.ctrlKey&&!e.metaKey,c=e.code;
  let done=true;
  const blockCombo=IS_MAC?mod&&e.altKey&&!e.shiftKey:mod&&e.shiftKey&&!e.altKey;

function vReport(){

}

/* ---------- 進步曲線：只畫有作答的日子 ---------- */
const CAT_ORDER=["TOEIC Part 5","TOEIC Part 6","TOEIC Part 7","統計學","巨量資料概論","AI應用規劃師（初級）","AI應用規劃師（中級）","其他"];
function firstOnly(L){const seen=new Set();return L.filter(r=>{if(seen.has(r.id))return false;seen.add(r.id);return true})}
function niceTime(v){const c=[30e3,60e3,90e3,120e3,180e3,240e3,300e3,600e3,900e3,1200e3,1800e3,3600e3];for(const x of c)if(x>=v*1.08)return x;return Math.ceil(v/3600e3)*3600e3}
function lineChart(pts,o){ // pts:[{lab,y,tip}]（y 為 null 時不畫點）
  const W=Math.round(Math.max(300,Math.min(680,(app.clientWidth||640)))),H=160,ml=46,mr=18,mt=18,mb=26,n=pts.length,iw=W-ml-mr,ih=H-mt-mb;
  const X=i=>n===1?ml+iw/2:ml+i*iw/(n-1),Y=v=>mt+ih*(1-v/o.max);
  let g="";o.ticks.forEach(t=>{const y=Y(t).toFixed(1);g+=`<line class="ch-grid" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"/><text class="ch-txt" x="${ml-8}" y="${(+y+4).toFixed(1)}" text-anchor="end">${o.fmt(t)}</text>`});
  const step=Math.max(1,Math.ceil(n/6));
  pts.forEach((p,i)=>{if(i%step===0||i===n-1)g+=`<text class="ch-txt" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${p.lab}</text>`});
  let d="",pen=false;pts.forEach((p,i)=>{if(p.y==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1);pen=true});
  let dots="",hits="";pts.forEach((p,i)=>{if(p.y==null)return;const x=X(i).toFixed(1),y=Y(p.y).toFixed(1);
    dots+=`<circle class="ch-dot" cx="${x}" cy="${y}" r="4"/>`;
    hits+=`<circle class="ch-hit" cx="${x}" cy="${y}" r="14" data-tip="${esc(p.tip)}"><title>${esc(p.tip)}</title></circle>`});
  const li=pts.map(p=>p.y!=null).lastIndexOf(true);
  const last=li>=0?`<text class="ch-val" x="${X(li).toFixed(1)}" y="${(Y(pts[li].y)-10).toFixed(1)}" text-anchor="${n>1?"end":"middle"}">${o.fmt(pts[li].y)}</text>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}<path class="ch-line" d="${d}"/>${dots}${last}${hits}</svg>`;
}
function vTrend(L){
  const cats=CAT_ORDER.filter(c=>L.some(r=>tlogCat(r)===c));
  if(!cats.length)return "";
  let cat=st.chartCat;if(!cats.includes(cat)){const lastR=L[L.length-1];cat=tlogCat(lastR)}
  let rows=L.filter(r=>tlogCat(r)===cat);const first=!!st.chartFirst;
  if(first)rows=firstOnly(rows);
  const days={};rows.forEach(r=>{const k=dayKey(r.t);(days[k]=days[k]||[]).push(r)});
  const keys=Object.keys(days).sort(),agg=keys.map(k=>({k,a:aggTime(days[k])}));
  let h=`<h2>進步曲線</h2><p class="note">只畫有作答的日子；每一科分開計算</p>
  <div class="chips">${cats.map(c=>`<button class="${c===cat?"on":""}" data-act="chartCat" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="chips"><button class="${first?"":"on"}" data-act="chartFirst" data-v="0">含重做</button><button class="${first?"on":""}" data-act="chartFirst" data-v="1">只算第一次作答</button></div>`;
  if(!agg.length)return h+`<p style="margin-top:14px">這個範圍還沒有紀錄。</p>`;
  const lab=k=>k.slice(5).replace("-","/");
  const accPts=agg.map(({k,a})=>({lab:lab(k),y:a.acc*100,tip:`${lab(k)}．${a.n} 題．正確率 ${Math.round(a.acc*100)}%`}));
  const tPts=agg.map(({k,a})=>({lab:lab(k),y:a.tn?a.avg:null,tip:`${lab(k)}．${a.tn} 題計時．平均 ${fmtDur(a.avg)}／題`}));
  const tMax=niceTime(Math.max(...agg.map(x=>x.a.tn?x.a.avg:0),1));
  const A0=agg[0].a,A1=agg[agg.length-1].a;
  if(agg.length>1){
    const dAcc=Math.round(A1.acc*100)-Math.round(A0.acc*100);
    h+=`<p class="trend">${agg.length} 天．正確率 ${Math.round(A0.acc*100)}% → <b>${Math.round(A1.acc*100)}%</b>（${dAcc>=0?"+":""}${dAcc}）`+
      (A0.tn&&A1.tn?`．平均每題 ${fmtDur(A0.avg)} → <b>${fmtDur(A1.avg)}</b>（${A1.avg<=A0.avg?"快了":"慢了"} ${fmtDur(Math.abs(A1.avg-A0.avg))}）`:"")+`</p>`;
  }else h+=`<p class="trend">目前只有 1 天的紀錄，再練一天就能看到變化。</p>`;
  h+=`<div class="chartwrap"><div class="chtip" id="chtip"></div>
    <h3>正確率</h3>${lineChart(accPts,{max:100,ticks:[0,50,100],fmt:v=>Math.round(v)+"%",label:cat+" 每日正確率"})}
    <h3>平均每題時間</h3>${lineChart(tPts,{max:tMax,ticks:[0,tMax/2,tMax],fmt:v=>fmtDur(v),label:cat+" 每日平均每題時間"})}</div>`;
  return h;
}
function chartTip(e){

    <div class="kpi"><span>7 天內</span><b>${within(7)}</b></div><div class="kpi"><span>已熟練</span><b>${done}</b></div></div>`;
  const resume=st.pr&&st.pr.src==="nrev"&&st.pr.ids.some(id=>st.pr.ans[id]===undefined)&&st.pr.ids.every(id=>QM[id]);
  if(due.length)h+=`<div class="row-btns" style="margin-top:14px"><button class="btn primary" data-act="nrevStart">開始複習（${due.length} 題）</button>${resume?`<button class="btn" data-act="presume">繼續上一回</button>`:""}</div>`;
  else{const next=all.map(id=>R(id).due).filter(d=>d!=null).sort((a,b)=>a-b)[0];
    h+=`<p style="margin-top:14px">${all.length?`今天沒有到期的筆記。${next?`下一次：${dueText(next)}（${all.filter(id=>R(id).due===next).length} 題）`:""}`:"還沒有筆記。作答後在詳解下方的「我的筆記」寫下錯因，就會自動排進這裡。"}</p>`}
  if(all.length){
    const order=id=>{const d=R(id).due;return d==null?Infinity:d};
    h+=`<h2>全部筆記（${all.length}）</h2><ul class="nlist">`;
    // 清單只顯示筆記第一行（同樣以 Markdown／LaTeX 呈現）
    all.sort((a,b)=>order(a)-order(b)).forEach(id=>{const r=R(id),first=(st.notes[id].split("\n").find(s=>s.trim())||"").trim();
      h+=`<li><button class="link" data-act="jump" data-id="${id}">${qLabel(id)}</button>
        <span class="note">．${stageName(r.lv)}${r.due!=null?`．${dueText(r.due)}複習`:`．<button class="linkbtn" data-act="nrevReset" data-id="${id}">重新複習</button>`}</span>
        <div class="nsnip md" data-snip="${esc(first)}"></div></li>`});
    h+=`</ul>`;
  }
  return h;
}

function render(){
  if(st.view==="prac"&&!(st.pr&&st.pr.ids.length&&st.pr.ids.every(id=>QM[id])))st.view="home";  // 題庫鎖定時，AI 題目的抽考先回目錄
  if(st.view==="exam"&&!ALL.some(e=>e.id===st.exam))st.view="home";
  if(!isOwner()){  // 對外只開放 TOEIC 的畫面，其餘一律回到 TOEIC 首頁
    const toeicOnly=st.view==="home"||st.view==="stats"||st.view==="notes"||st.view==="unlock"||
      (st.view==="exam"&&exScope(findEx(st.exam))==="toeic")||
      ((st.view==="report"||st.view==="pset")&&st.scope==="toeic")||
      (st.view==="prac"&&(st.pr.scope||"toeic")==="toeic");
    if(!toeicOnly){st.view="home";st.scope="toeic"}
  }
  const isRead=st.view==="exam"&&(findEx(st.exam).part===7||findEx(st.exam).part===6);
  const v=isRead?vReading:({home:isOwner()?vHome:vToeic,exam:vExam,pset:vPset,prac:vPrac,report:vReport,sync:vSync,stats:vStats,notes:vNotes,unlock:vUnlock}[st.view]||vHome);
  const pl=document.getElementById("paneL"),pr=document.getElementById("paneR");
  const keep=pl&&pr?{k:pl.dataset.key,l:pl.scrollTop,r:pr.scrollTop}:null;
  app.innerHTML=v();
  app.classList.toggle("readmode",isRead);document.body.classList.toggle("readmode",isRead);
  if(isRead){const nl=document.getElementById("paneL"),nr=document.getElementById("paneR");
    if(keep&&nl&&nl.dataset.key===keep.k){nl.scrollTop=keep.l;if(!p7ResetR)nr.scrollTop=keep.r}
    p7ResetR=false}
  renderTopbar();renderSide();hydrateNotes();
  syncTimer();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toTop(){window.scrollTo(0,0)}
function qTop(){const el=app.querySelector(".panel");if(!el)return;
  const r=el.getBoundingClientRect();if(r.top<64||r.top>window.innerHeight*0.6)el.scrollIntoView({block:"start"})}
const p5Ids=base=>Object.keys(QM).filter(id=>{const e=QM[id].ex;return e.kind==="toeic"&&(e.part||5)===5&&(!base||(e.stage>=1&&e.stage<=3))});
// 真考 Part 5 題型比例（w＝一回 30 題中的約略題數；依據見 readme「TOEIC Part 5：題型比例」）
const P5_MIX=[
  {n:"詞性",w:8,g:["t_p5pos","t_pos","t_p5noun"]},
  {n:"單字",w:10,g:["t_p5vocab","t_p5chunk","t_vocab","t_p5wn","t_p5wv","t_p5wa","t_p5wd","t_p5wp","t_p5adv"]},
  {n:"介系詞",w:2,g:["t_p5prep"]},
  {n:"動詞形態",w:4,g:["t_p5fin","t_p5voice","t_p5tense","t_p5agree"]},
  {n:"連接詞",w:2,g:["t_p5conj","t_conn","t_p5cadv","t_p5corr"]},
  {n:"代名詞",w:1.5,g:["t_p5pron","t_p5indef"]},
  {n:"關係詞與子句",w:1,g:["t_p5rel","t_p5ncl"]},
  {n:"其他文法",w:1.5,g:["t_p5qty","t_p5det","t_p5comp","t_p5deg","t_p5part","t_p5ger","t_p5caus","t_p5inv","t_p5subj","t_grammar"]}
];
// 每日 15 題：依 P5_MIX 分配各題型題數（基礎版沒有的題型按比例分給其他題型）；
// 每類先給整數題數，剩下的名額依小數部分隨機分配，長期平均符合比例。
// 各類內最多合計 3 題錯題複習，其餘優先出沒寫過的題目。不限時：寫一題、檢討一題。
function newDaily(base,n=15){
  const all=p5Ids(base),byTag={};P5_MIX.forEach(c=>c.g.forEach(g=>byTag[g]=c));
  const pools=P5_MIX.map(c=>({c,ids:all.filter(id=>byTag[QM[id].q.g]===c)})).filter(x=>x.ids.length);
  const W=pools.reduce((s,x)=>s+x.c.w,0);
  pools.forEach(x=>{x.exact=n*x.c.w/W;x.take=Math.floor(x.exact)});
  for(let left=n-pools.reduce((s,x)=>s+x.take,0);left>0;left--){
    const rem=pools.map(x=>Math.max(0,Math.min(x.exact-x.take,x.ids.length-x.take))),R=rem.reduce((s,v)=>s+v,0);
    let r=Math.random()*R,j=0;while(j<pools.length-1&&r>=rem[j]){r-=rem[j];j++}
    pools[R>0?j:Math.floor(Math.random()*pools.length)].take++;
  }
  let wrLeft=3;const ids=[];
  shuffle([...pools]).forEach(x=>{
    const wr=shuffle(x.ids.filter(isWrong)).slice(0,Math.min(wrLeft,x.take));wrLeft-=wr.length;
    const un=shuffle(x.ids.filter(id=>st.ans[id]===undefined)),rest=shuffle(x.ids.filter(id=>st.ans[id]!==undefined&&!wr.includes(id)));
    ids.push(...[...new Set([...wr,...un,...rest])].slice(0,x.take));
  });
  const mix=pools.filter(x=>x.take).map(x=>x.c.n+" "+x.take).join("．");
  return {ids:shuffle(ids),ans:{},i:0,src:"daily",base:!!base,scope:"toeic",mix,title:base?"基礎每日 15 題":"每日 15 題"};
}
function fmtDur(ms){const t=Math.max(0,Math.round(ms/1000));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function poolIds(pool){const w=wrongIds(),f=flagIds();
  return pool==="wrong"?w:pool==="flag"?f:pool==="both"?[...new Set([...w,...f])]:pool==="note"?noteIds():scopeIds()}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t||!(app.contains(t)||topbar.contains(t)||side.contains(t)||t===scrim))return;
  const d=t.dataset,a=d.act;
  if(d.scope)st.scope=d.scope;
  const ex=findEx(st.exam);let scroll=null;
  switch(a){
    case"go":closeSide();st.view=d.v;scroll=toTop;break;
    case"side":toggleSide();return;
    case"mode":closeSide();
      if(d.v==="owner"){if(AILock.ok){st.mode="owner";st.view="home"}else st.view="unlock"}
      else{st.mode="toeic";st.view="home";st.scope="toeic"}
      scroll=toTop;break;
    case"open":st.view="exam";st.exam=d.ex;st.scope=exScope(findEx(d.ex));scroll=toTop;break;
    case"goto":st.cur[st.exam]=+d.i;scroll=qTop;break;
    case"pgoto":st.pr.i=+d.i;scroll=qTop;break;
    case"pick":{const k=+d.k,q=QM[d.id].q,pr=st.view==="prac";
      if(pr?st.pr.ans[d.id]!==undefined:st.ans[d.id]!==undefined)break;
      const ms=elapsedFor(pr?"p|"+d.id+"|"+st.pr.i:"q|"+d.id);
      if(pr){st.pr.ans[d.id]=k;if(!st.pr.end&&st.pr.ids.every(x=>st.pr.ans[x]!==undefined))st.pr.end=now();
        if(st.pr.src==="nrev")nrevGrade(d.id,okAns(q,k))}else setAns(d.id,k);
      logTime(d.id,ms,okAns(q,k),{src:pr?"p":"e"});QT.key=null;break}
    case"optFirst":st.optFirst=!st.optFirst;break;
    case"noteEdit":{noteEdit.add(d.id);render();const ta=app.querySelector(`.note-in[data-id="${d.id}"]`);
      if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}return}
    case"nrevStart":{const ids=shuffle(dueIds());if(!ids.length)return;
      st.pr={ids,ans:{},i:0,src:"nrev",scope:isOwner()?"all":"toeic",title:"筆記複習"};st.view="prac";scroll=toTop;break}
    case"nrevReset":st.nrev[d.id]={lv:0,due:dayStart(now())};st.nrevT[d.id]=now();dirty=true;break;
    case"noteDone":noteEdit.delete(d.id);persist();Sync.schedule();render();return;
    case"flag":toggleFlag(d.id);break;
    case"copy":copyQuestion(d.id);return;
    case"daily":st.pr=newDaily(!!d.base);st.scope="toeic";st.view="prac";scroll=toTop;break;
    case"pstartAgain":{
      const p=st.pr||{};let ids=[];
      if(p.src==="pset"){st.scope=p.scope;ids=shuffle([...poolIds(p.pool)]).slice(0,p.n);
        if(!ids.length){st.view="pset";scroll=toTop;break}}
      else{st.pr=newDaily(p.base);st.view="prac";scroll=toTop;break}
      st.pr={...p,ids,ans:{},i:0};st.view="prac";scroll=toTop;break;
    }
    case"prev":if(st.view==="prac")st.pr.i--;else st.cur[st.exam]=(st.cur[st.exam]||0)-1;scroll=qTop;break;
    case"next":if(st.view==="prac")st.pr.i++;else st.cur[st.exam]=(st.cur[st.exam]||0)+1;scroll=qTop;break;
    case"report":st.view="report";scroll=toTop;break;
    case"pset":st.view="pset";scroll=toTop;break;
    case"presume":st.view="prac";scroll=toTop;break;
    case"pnum":{const inp=document.getElementById("pcount");inp.value=d.n==="999"?scopeIds().length:d.n;return}
    case"pstart":{
      const pool=(app.querySelector('input[name="pool"]:checked')||{}).value;
      const ids=pool?poolIds(pool):[];
      const n=parseInt(document.getElementById("pcount").value,10);
      if(!ids.length){document.getElementById("pmsg").textContent="這個範圍目前沒有題目。";return}
      if(!(n>0)){document.getElementById("pmsg").textContent="請輸入 1 以上的題數。";return}
      st.pr={ids:shuffle([...ids]).slice(0,n),ans:{},i:0,src:"pset",pool,n,scope:st.scope};st.view="prac";scroll=toTop;break}
    case"jump":{const {ex:x,i}=QM[d.id];st.view="exam";st.exam=x.id;st.scope=exScope(x);st.cur[x.id]=i;scroll=toTop;break}
    case"nextWrong":{const c=st.cur[ex.id]||0,n=ex.qs.length;let f=-1;
      for(let s=1;s<=n;s++){const i=(c+s)%n;if(isWrong(ex.id+"-"+i)){f=i;break}}
      if(f<0){showToast("本卷沒有錯題");return}st.cur[ex.id]=f;scroll=qTop;break}
    case"retryWrong":{let f=-1;ex.qs.forEach((q,i)=>{const id=ex.id+"-"+i;if(isWrong(id)){delAns(id);if(f<0)f=i}});
      if(f<0){showToast("本卷沒有錯題");return}st.cur[ex.id]=f;scroll=toTop;break}
    case"aiLock":if(!confirm("登出站長自用？會清除這台裝置記住的密碼並鎖定 AI 題庫，作答紀錄會保留。"))return;
      AILock.forget();st.mode="toeic";st.view="home";persist();location.reload();return;
    case"theme":applyTheme(d.v);renderTopbar();return;
    case"chartCat":st.chartCat=d.c;persist();render();return;
    case"chartFirst":st.chartFirst=d.v==="1";persist();render();return;
    case"jumpblank":{const el=document.getElementById("blank-"+d.n),pl=document.getElementById("paneL");
      if(el&&pl){pl.scrollTop+=el.getBoundingClientRect().top-pl.getBoundingClientRect().top-pl.clientHeight/3;el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1200)}return}
    case"p7tab":p7Tab=d.t==="tr"?"tr":"q";p7ResetR=true;render();return;
    case"jumpq":{const el=document.getElementById("rq-"+d.n),pr=document.getElementById("paneR");
      if(el&&pr){pr.scrollTop+=el.getBoundingClientRect().top-pr.getBoundingClientRect().top-8}return}
    case"p7pick":if(!st.p7d||typeof st.p7d!=="object")st.p7d={};st.p7d[d.id]=+d.k;persist();render();return;
    case"p7set":{if(+d.i<0)return;st.cur[st.exam]=+d.i;save();render();window.scrollTo(0,0);
      const l=document.getElementById("paneL"),r=document.getElementById("paneR");if(l)l.scrollTop=0;if(r)r.scrollTop=0;return}
    case"p7submit":{const sets=p7Sets(ex),cur=st.cur[ex.id]||0,set=sets.find(s=>s.idx.includes(cur))||sets[0];
      if(set.idx.some(i=>st.ans[ex.id+"-"+i]===undefined&&(st.p7d||{})[ex.id+"-"+i]===undefined))return;
      const ms=elapsedFor("set|"+ex.id+"|"+set.p),newIds=set.idx.map(i=>ex.id+"-"+i).filter(id=>st.ans[id]===undefined),per=ms!=null&&newIds.length?ms/newIds.length:null;
      newIds.forEach(id=>{setAns(id,st.p7d[id]);logTime(id,per,okAns(QM[id].q,st.p7d[id]),{src:"e",set:newIds.length,sm:ms==null?null:Math.round(ms)})});
      set.idx.forEach(i=>{delete st.p7d[ex.id+"-"+i]});QT.key=null;
      p7ResetR=true;p7Tab="q";save();render();const r=document.getElementById("paneR");if(r)r.scrollTop=0;return}
    case"p7redo":{const sets=p7Sets(ex),cur=st.cur[ex.id]||0,set=sets.find(s=>s.idx.includes(cur))||sets[0];
      if(!confirm("清除這個題組的作答，重新作答？"))return;
      set.idx.forEach(i=>{delAns(ex.id+"-"+i);if(st.p7d)delete st.p7d[ex.id+"-"+i]});p7ResetR=true;save();render();
      const r=document.getElementById("paneR");if(r)r.scrollTop=0;return}
    case"resetExam":if(!confirm(`確定清除「${ex.title}」的作答紀錄？標註會保留。`))return;
      ex.qs.forEach((q,i)=>{delAns(ex.id+"-"+i);if(st.p7d)delete st.p7d[ex.id+"-"+i]});st.cur[ex.id]=0;scroll=toTop;break;
    case"syncConnect":{
      const v=((document.getElementById("tok")||{}).value||"").trim();
      if(!v){showToast("請先貼上 Token");return}
      Sync.cfg={token:v,gistId:"",last:0};Sync.saveCfg();Sync.msg="";
      render();
      Sync.run().then(()=>{if(Sync.state==="ok")showToast("已連線並完成同步")});
      return;
    }
    case"syncNow":Sync.run().then(()=>{if(Sync.state==="ok")showToast("同步完成")});return;
    case"syncOff":if(!confirm("停用這台裝置的同步？本機與雲端紀錄都會保留。"))return;
      clearTimeout(Sync.timer);Sync.timer=null;Sync.cfg={token:"",gistId:"",last:0};Sync.saveCfg();Sync.state="off";Sync.msg="";break;
    case"exportData":{
      const code=JSON.stringify(payload());
      const ta=document.getElementById("bk");if(ta)ta.value=code;
      copyText(code,()=>showToast("備份碼已複製"));
      document.getElementById("bkmsg").textContent=`共 ${Object.keys(st.ans).length} 筆作答紀錄。`;
      return;
    }
    case"importData":{
      const msg=document.getElementById("bkmsg");
      let o;try{o=JSON.parse((document.getElementById("bk").value||"").trim())}catch(err){msg.textContent="備份碼格式不正確。";return}
      if(!o||typeof o.ans!=="object"){msg.textContent="這不是本系統的備份碼。";return}
      const before=Object.keys(st.ans).length;
      mergeRemote(o);persist();Sync.schedule(500);
      showToast(`匯入完成（${before} → ${Object.keys(st.ans).length} 筆）`);
      render();return;
    }
  }
  save();render();if(scroll)scroll();
});
